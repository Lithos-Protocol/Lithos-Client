# https://www.playframework.com/documentation/latest/Configuration
{

  node {
    url = "http://127.0.0.1"
    key = ""
    storagePath = ""
    pass        = ""
    networkType = "MAINNET"
    # Before mainnet mining, enable these in the Ergo node's configuration:
    # ergo.chain.reemission.checkReemissionRules = true
    # ergo.wallet.checkEIP27 = true
    # The first validates consensus; the second handles payments made by the node wallet.

    # Required by the Ergo SDK the client is built on. The client itself reads everything from the node.
    explorerURL = "default"
    # How many EIP-3 addresses this client holds keys for. This must be at least
    # emission.maxLenderKeys. Raising it later is safe; lowering it strands funds until you raise it
    # back. Costs a little startup time.
    numAddresses = 32
    # Match the node's ergo.node.mempoolSorting: "bySize" or "byExecutionCost".
    mempoolSorting = "bySize"
    # Which Lithos deployment the contracts are compiled against. Leave file empty to use the network's
    # own (every production miner). A path to a descriptor written by tools.DeployProtocol points the
    # client at tokens a private chain minted for itself; see DEVNET.md. The file must exist, parse,
    # and name the same network as networkType, or the client refuses to start.
    deployment {
      file = ""
      # A descriptor is refused on MAINNET unless this is true, so a mislaid devnet file cannot repoint
      # a mainnet miner at contracts no real emission box pays into.
      allowOnMainnet = false
    }
  }
  play.http.secret.key="changethissecret"
  # Blake2b256 hash of the API key. Replace the shipped development value.
  # in the same manner that you change your node's apiKeyHash. The current value is "hello"
  lithos.apiKeyHash="324dcf027dd4a30a932c441f365a25e86b173defa4b8e58948253471b81b72cf"

  play.server.akka.terminationTimeout = 30s

  # Local mining observations and DEX graphs, with independent background collection and storage.
  stats {
    enabled = true
    refreshIntervalMs = 1000
    staleAfterMs = 15000
    dex {
      enabled = true
      # Delay after a refresh finishes; one physical node read may run at a time.
      refreshIntervalMs = 30000
      staleAfterMs = 120000
      readTimeoutMs = 3000
      refreshBudgetMs = 20000
      # Recent pool history only: 200 boxes per page, at most the last 30D window plus its predecessor.
      historyPages = 10
      timestampLookups = 128
    }
    storage {
      enabled = true
      backend = "leveldb"
      path = ".lithos/stats"
      flushIntervalMs = 5000
      # Latest snapshot plus one compact observation per interval; intermediate observations coalesce.
      sampleIntervalMinutes = 5
      pruning {
        enabled = true
        retentionDays = 30
        intervalMs = 60000
        batchSize = 256
      }
    }
    mining {
      enabled = true
      # Initial timestamp window and ongoing retention; totals cover retained history only.
      historyDays = 30
      pruning.enabled = true
      refreshIntervalMs = 10000
      staleAfterMs = 120000
      blocksPerRefresh = 20
      readTimeoutMs = 3000
      readBudgetMs = 20000
    }
  }
  stats-mailbox {
    mailbox-type = "akka.dispatch.NonBlockingBoundedMailbox"
    mailbox-capacity = 256
  }

  stratum {
    # Served until a difficulty commitment takes effect on chain; after that the stratum serves the
    # commitment. Also the diff state.autoCommit commits. Commit from the web panel instead.
    diff = "4.0G" # Format diff as (value)(powTen), e.g "4.0G", "1.52M", "300.1K", etc.

    # Change the port if you are running multiple Lithos Client setups (for example, one for testnet and one for mainnet)
    stratumPort = 4444
    # The address the stratum listens on. "0.0.0.0" accepts rigs on every network interface. Set it
    # to "127.0.0.1" if your rigs run on this machine, or to one of this machine's LAN addresses to
    # accept rigs from that network only. An address this machine does not have stops the stratum.
    bindAddress = "0.0.0.0"
    # Value of 2 is recommended, as it gives a large nonce space your rigs can work through during a single job.
    # Increasing it may cause duplicate shares and extraNonce changes in your mining software.
    extraNonce1Size = 2

    # How many ms it takes for your no work submission before extra nonce is rotated. A value
    # of 0 disables rotations. Should not be needed unless extraNonce1Size is raised above 2.
    rotateExtraNonceInterval = 0

    connectionTimeout = 60000
    blockRefreshInterval = 1000
    # Send your mining software a higher difficulty than your committed one, so it submits fewer shares.
    # What Lithos pays you at is unchanged. The difficulty sent is reductionMultiplier times your
    # committed diff: 10, 100, 1000 or 10000. At 10000 it is the super-share difficulty, so every
    # share your software reports is a super share. Lower values send more shares and give a
    # steadier hashrate reading.
    reduceShareMessages = true
    reductionMultiplier = 10000

    # Force lithos stratum to use config difficulty.
    # NOTE: This could prevent you from submitting NISPs if your config difficulty is lower than
    # your difficulty commitment on the blockchain. Only recommended for testing out the
    # effects of different difficulty values.
    forceConfigDiff = false
    # How often difficulty should be refreshed from the current commitment state
    diffRefreshInterval = 60000


    # Options related to Lithos mining candidates
    candidate {
      # How many collateral boxes to keep pre-loaded. There is a maximum of 100 at any given moment.
      collateralPoolSize = 100
      # How often the collateral set is refreshed, in ms. Also refreshed on every new block.
      collateralRefreshInterval = 60000
      # "highestFee" uses the priority fee and clearance age below. "random" draws uniformly from
      # the loaded, usable boxes, regardless of fee or age; it may earn a lower priority fee.
      collateralStrategy = "highestFee"
      # With highestFee: blocks a box may stay live before age takes priority over every fee,
      # oldest first. Until then the highest priority fee wins. 100 to 14400;
      # 7200 is about 10 days on mainnet. Ignored by random.
      clearanceAge = 7200

      # Maximum amount of time to wait for genesis tx construction before a solo-candidate is sent out instead.
      genesisWaitMs = 1500

      # Wait for additions before sending genesis, up to genesisWaitMs from the new tip.
      waitForBlockPackage = true
      # Milliseconds between mid-block package rebuilds and mempool candidate refreshes; 0 disables them.
      mempoolRefreshMs = 20000
      # Extra package revenue required for a mid-block job change, in nanoERG (1000000 = 0.001 ERG).
      # Compared with the published package; 0 permits every refresh. Tokens are not valued.
      # Initial packages and required fallbacks bypass this threshold.
      minCandidateChangeRevenue = 1000000
      # Also change the job mid-block when a rebuilt package adds rollup or emission transactions.
      # Such transactions earn no revenue, but they save on fees and necessary for the protocol.
      refreshForProtocolTxs = true
      # How many rollup or emission transactions the rebuilt package must carry that the current
      # job does not, before the job is changed. At least 1.
      minNewProtocolTxs = 1

      # Wallet boxes set aside to fund transactions that need a wallet input inside your own block:
      # fraud proofs, for now. Each is one plain box of yours, the smallest that qualifies. It stays in
      # your wallet and is never sent anywhere; it is only kept out of the client's other transactions
      # until one of your blocks spends it, and is then replaced. Your last usable box is never set
      # aside, so the ordinary mempool path always has one. Only used while blockTransactions is on.
      # 0 turns this off: those transactions then reach the chain through the mempool alone.
      pinnedInputs = 1

      # Insert additional non-genesis transactions into your blocks.
      # This includes Lithos related transactions (rollups, emissions)
      # Along with batcher, storage rent, and other transactions.
      # These transactions earn you and the pool extra rewards
      # and cost no transaction fee to make. If your node refuses them, that block is mined
      # with the genesis transaction alone.
      blockTransactions = true
      # How long to wait for non-genesis transactions to be built, in ms. A source that has not answered
      # 2 seconds before this (or a quarter of it, if shorter) is left out; what the others built still
      # goes into your block.
      blockTxTimeout = 20000

      # Fraction of the node's block byte and cost limits your whole package may claim.
      # Well under 1 on purpose: the node adds its own transactions and picks a remainder you never
      # see, and a carried unconfirmed ancestor counts no execution cost unless your node reports one.
      # It is recommended to keep this value below 0.8
      blockShare = 0.5

      # What each transaction source may contribute, applied before the package-wide share above.
      # A source that is off is never asked, so it costs no build and no node read.
      # Each slot is block space not earning a fee, so keep these small.
      sources {
        rollups {
          # Rollup work your block carries fee-less is not also sent to the mempool with a fee while
          # that block is being mined. If the block passes without it, the fee-paying copy goes out
          # then, about one block later. NISP submissions and fraud proofs with 10 blocks or fewer
          # left in their window are always sent at once.
          enabled  = true
          maxTxs   = 5
          maxBytes = 262144
          maxCost  = 1000000
          # Unconfirmed transactions one rollup transaction may carry into your block ahead of itself,
          # usually other miners' NISP submissions queued on the same rollup. These count towards
          # maxTxs. Work needing more is left out of your block until they confirm; it still reaches
          # the mempool as usual. 0 offers only work that spends a confirmed rollup box.
          maxAncestorTxs = 4
        }
        # Storage rent: boxes nobody has touched for four years, which anyone may collect.
        # On by default. startHeight is where the walk begins, and should be set to roughly where
        # collection has already caught up rather than to the start of the chain.
        # A collection is two transactions: the sweep, and one folding what it took into a single
        # box of yours, so maxTxs must be at least 2 while this is enabled. maxCost is twice the other
        # sources' because each claimed box can cost two inputs, one in each transaction.
        # Tokens on claimed boxes go to your own wallet, 0.001 ERG and up to 20 token types a box.
        rent {
          enabled        = true
          maxTxs         = 2
          maxBytes       = 262144
          maxCost        = 2000000
          startHeight    = 837000
          scanIntervalMs = 30000
          blocksPerScan  = 200
        }
        # Candidate budget for native ErgoDEX swaps, deposits and redemptions, including ancestors.
        # Every order you execute pays you its executor fee, with no miner fee out of it in your own block.
        ergodex {
          enabled  = true
          maxTxs   = 20
          maxBytes = 262144
          maxCost  = 1000000
        }
        # Candidate budget for LithosDex order executions, their placements and the closing flush.
        # Every order you execute pays you its executor fee, with no miner fee out of it in your own block.
        lithosdex {
          enabled  = true
          maxTxs   = 20
          maxBytes = 262144
          maxCost  = 1000000
        }
        # Candidate budget for collateral-queue Clears and Activates. A Clear pays you the forfeited
        # queue box (about 2.9 ERG plus its LIT permit) and may use the whole budget; Activates alone
        # stop at emission.candidateActivates.
        emissions {
          enabled  = true
          maxTxs   = 20
          maxBytes = 262144
          maxCost  = 1000000
        }
        # Upkeep: keyless maintenance of other protocols' boxes, whose own scripts say when one is
        # due and what its successor is, carried in your block with no fee and no key. The shipped job
        # cannot spend your wallet: it spends only boxes at its own script and signs with no key, and
        # the client refuses a transaction spending a box the job did not find or one at your wallet's
        # keys. Off by default. Each job under `jobs` is one reviewed protocol; a job runs only when
        # jobs.<name>.enabled = true, and a job name that is enabled and unknown is refused at startup.
        upkeep {
          enabled        = false
          maxTxs         = 5
          maxBytes       = 262144
          maxCost        = 1000000
          # Milliseconds between discovery passes over the enabled jobs' boxes.
          scanIntervalMs = 60000
          # Box ids one job may hold between passes beyond its boxIds; a job finding more keeps the
          # soonest due of the boxes discovery read, which on an indexed node is at most the 1,000
          # newest at the script. Listed boxIds are never cut (at most maxBoxesPerJob, and never
          # more than 256 per job).
          maxBoxesPerJob = 256
          # Discovery passes a box sits out after its build failed, before it is offered again, in
          # case the failure has passed. Ten passes at the interval above is ten minutes; a box
          # refused again sits out as many again. A box its job says cannot pay is not retried; it
          # is held until a scan stops finding it.
          retryAfterScans = 10
          # "candidate" offers what upkeep builds to your block. "observe" answers every block
          # request empty at once and, in a background task, builds and sizes everything as for a
          # block, asks your node to check each transaction (one /transactions/check call per
          # successor, up to maxTxs per block) and logs the verdict. Use it to watch upkeep against
          # real boxes before your miner has found a block. Observe keeps no memory: a box candidate
          # mode would set aside is rebuilt and logged at every height; a height that arrives while the
          # previous task is still running is skipped, not queued. It runs only while the stratum builds
          # candidates with blockTransactions = true, with this source enabled, maxTxs above 0, and at
          # least one job enabled.
          mode = "candidate"
          # In candidate mode, put each successor through your node's transaction check before it
          # is offered (one /transactions/check call per successor, in the build that starts when a
          # block's height is known) and drop any the node refuses. A package the node rejects loses
          # every inserted transaction with it, so leave this on.
          verifyWithNode = true
          # One block per job. None ships enabled. Every job takes the same two keys: enabled, and
          # boxIds, boxes to maintain by id (64-hex box ids, each listed once, at most maxBoxesPerJob
          # of them). The list is read from the UTXO set on every node, indexed or not; on a plain
          # node it is all a job sees. These are the boxes as they stand: advancing a box gives it a
          # new id, which a plain node cannot be asked to follow, so the list goes stale after each
          # beat and needs refreshing. Any other key in a block is that job's own.
          jobs {
            # The reference job: advances due-job boxes (DueJob.ergo, kept with the tests), which state in
            # their registers when they are next due and what they pay, and let anyone recreate them
            # once due, lighter by at most the tip. The tip is paid to this miner's collection
            # contract. Discovery by script needs a node started with ergo.node.extraIndex = true; on
            # a plain node only the boxes listed in boxIds are maintained.
            heartbeat {
              enabled = false
              boxIds = []
              # The smallest tip, in nanoERG, a beat must pay: a box offering less is not maintained,
              # and a box offering enough that cannot pay it is held until it changes. The default,
              # a thousandth of an ERG, means no beat for free: a box anyone paid dust into at the
              # public script is not re-stamped, block after block, with its rent clock reset each
              # time. 0 maintains every box, free beats included, at the cost of the block space.
              minTip = 1000000
            }
          }
        }
      }

      # Guard the intermediate outputs a candidate creates for its own later transactions with
      # TrueProp instead of your own P2PK. Cheaper in both validation cost and byte size, allowing
      # you to squeeze more transactions into your block.
      # CAUTION: Enable at your own risk. In the case of an error, intermediate outputs may
      # be exposed (and taken by others)
      useTruePropCollection = false

      # Append how long each stage took to the candidate log lines: building the genesis transaction,
      # collecting the extra transactions, and the wait before miners are given the job.
      # Useful when a block seems slow to reach your rigs.
      logTimings = false
      # Log package and source bytes/cost against their budgets, including final source contributions.
      logBudgets = false
    }
  }

  # Order discovery and execution settings for batching adapters.
  batching {
    ergodex {
      enabled = true
      # Milliseconds between confirmed-order scans.
      scanIntervalMs = 8000
      # Maximum order ids retained between scans; boxes are reloaded before execution.
      maxTrackedOrders = 512
      # Maximum pools tracked, newest first.
      maxTrackedPools = 256
      # Transaction slots per candidate build or broadcast pass, including carried ancestors.
      maxOrdersPerBlock = 20
      # Minimum gross revenue per fill, in nanoERG. An opening fill must also fund a takings box.
      minRevenueNanoErg = 1000000
      # Minimum gross revenue for broadcasts; net takings must remain positive after the miner fee.
      broadcastMinRevenueNanoErg = 2500000
      # Broadcast miner fee ceiling in nanoERG, further limited by the order's own cap.
      broadcastMinerFeeCeiling = 2000000
      # Skip pools whose current box was included more than this many blocks ago.
      maxPoolAgeBlocks = 20160
      # Broadcast orders using executor revenue for fees. Requires the ErgoDEX source enabled.
      broadcast = true
      # With broadcast on, also broadcast orders still in the mempool, spending the unconfirmed order box.
      # Off, a broadcast waits for an order to confirm and be indexed. Your own block reads them either way.
      broadcastMempoolOrders = true
      # Pool NFTs never to execute against.
      deniedPools = []
      # Milliseconds an order that priced but could not be built is left out of scans and builds.
      skippedOrderTtlMs = 3600000
      # Most such orders remembered at once, oldest forgotten first. Each costs about 200 bytes of memory,
      # so the default holds under 1 MB. 0 remembers none, and a bad order is retried on every build.
      maxSkippedOrders = 4096
      # Unconfirmed transactions one order may need carried into your block ahead of it: the transaction
      # that placed it and every unconfirmed ancestor of that one. An order needing more waits for them to
      # confirm. Each carried transaction is one more that can fail your run. 0 executes confirmed orders only.
      maxAncestorTxs = 2
      # Unconfirmed orders one build or broadcast pass takes, and how many of them any single transaction
      # may contribute. They are taken in rounds across the transactions that created them, so a
      # transaction carrying hundreds of order boxes takes maxMempoolOrdersPerTx places, not all of them.
      # Only the orders taken are parsed, which is what this bounds.
      maxMempoolOrders = 64
      maxMempoolOrdersPerTx = 4
      # Orders a run prices but fails to build before it stops trying more. Each failure is one wasted signature.
      maxUnbuildablePerRun = 32
      # Orders from one creating transaction a run fails to build before it passes over that transaction's
      # other orders untried. Keeps one spam transaction from using up maxUnbuildablePerRun on its own.
      maxUnbuildablePerTx = 2
      # How each run chooses which orders to execute against a pool, and in what order. "maxFees" searches for
      # the set and sequence that earns you the most, since each fill moves the price the next order sees.
      strategy = "maxFees"
      # Most milliseconds the strategy may search one plan. Never more than a quarter of the time left to
      # build, so a slow search cannot cost your block its extra transactions. 0 plans greedily without searching.
      searchBudgetMs = 250
    }
    # LithosDex orders against the single ERG:LIT pool. Runs whether or not this node mines:
    # broadcasting needs no stratum, and candidates additionally need stratum.candidate.sources.lithosdex.
    lithosdex {
      enabled = true
      # Milliseconds between confirmed-order scans.
      scanIntervalMs = 8000
      # Maximum order ids retained between scans; boxes are reloaded before execution.
      maxTrackedOrders = 512
      # Transaction slots per candidate build or broadcast pass, including carried ancestors.
      maxOrdersPerBlock = 20
      # Minimum executor fee per order, in nanoERG. An opening fill must also fund a takings box.
      minRevenueNanoErg = 1000000
      # Minimum executor fee for broadcasts; net takings must remain positive after the miner fee.
      broadcastMinRevenueNanoErg = 2500000
      # Broadcast miner fee ceiling in nanoERG, further limited by the order's own cap.
      broadcastMinerFeeCeiling = 2000000
      # Broadcast orders, paying miner fees out of executor fees. Your ERG is never spent.
      broadcast = true
      # With broadcast on, also broadcast orders still in the mempool, spending the unconfirmed order box.
      # Off, a broadcast waits for an order to confirm and be indexed. Your own block reads them either way.
      broadcastMempoolOrders = true
      # Close each candidate run with a flush, moving the pool's pending fees to the vault so providers
      # can claim them. It pays nothing and costs nothing in your own block. Never broadcast.
      autoFlush = true
      # Also execute orders for LithosDex pools other than ERG:LIT, in your own blocks and by broadcast. A pool is
      # served only when the contracts built from its own ids reproduce its pool and vault exactly.
      discoverPools = true
      # With discoverPools on, the most pools served besides ERG:LIT, newest first.
      maxTrackedPools = 256
      # Pool NFTs never to execute against.
      deniedPools = []
      # Milliseconds an order that priced but could not be built is left out of scans and builds.
      skippedOrderTtlMs = 3600000
      # Most such orders remembered at once, oldest forgotten first. Each costs about 200 bytes of memory,
      # so the default holds under 1 MB. 0 remembers none, and a bad order is retried on every build.
      maxSkippedOrders = 4096
      # Unconfirmed transactions one order may need carried into your block ahead of it: the transaction
      # that placed it and every unconfirmed ancestor of that one. An order needing more waits for them to
      # confirm. Each carried transaction is one more that can fail your run. 0 executes confirmed orders only.
      maxAncestorTxs = 2
      # Unconfirmed orders one build or broadcast pass takes, and how many of them any single transaction
      # may contribute. They are taken in rounds across the transactions that created them, so a
      # transaction carrying hundreds of order boxes takes maxMempoolOrdersPerTx places, not all of them.
      # Only the orders taken are parsed, which is what this bounds.
      maxMempoolOrders = 64
      maxMempoolOrdersPerTx = 4
      # Orders a run prices but fails to build before it stops trying more. Each failure is one wasted signature.
      maxUnbuildablePerRun = 32
      # Orders from one creating transaction a run fails to build before it passes over that transaction's
      # other orders untried. Keeps one spam transaction from using up maxUnbuildablePerRun on its own.
      maxUnbuildablePerTx = 2
      # How each run chooses which orders to execute against a pool, and in what order. "maxFees" searches for
      # the set and sequence that earns you the most, since each fill moves the price the next order sees.
      strategy = "maxFees"
      # Most milliseconds the strategy may search one plan. Never more than a quarter of the time left to
      # build, so a slow search cannot cost your block its extra transactions. 0 plans greedily without searching.
      searchBudgetMs = 250
    }
  }

  # Fees on LithosDex orders you place through the API or web panel, when the request does not set its
  # own. Both are paid only when a miner fills the order; a cancelled order pays neither.
  lithosdex {
    orders {
      # nanoERG you pay whoever fills each order. Miners skip orders paying less than they accept, so an
      # order under that waits. The default clears the shipped settings of every miner running this client.
      executorFeeNanoErg = 3000000
      # Most of the executor fee a miner may spend as a network fee when it broadcasts the fill. Must be
      # below executorFeeNanoErg. It comes out of the executor fee, never out of your funds.
      maxMinerFeeNanoErg = 1000000
    }
  }

  state {
    # If set to true, this disables all transactions and interactions with LFSM rollups
    disableTransforms = false
    # Register this miner and commit stratum.diff on chain, then keep the commitment equal to it.
    # Checked every minute from about a minute after startup, until the commitment is on chain.
    # Off by default: commit from the web panel (Mining > Difficulty > Commitment) or
    # POST /mining/commitment instead, which are refused while this is on. Unregistered, this miner cannot
    # submit NISPs and is not paid from rollups. A commitment binds 125 blocks after it is sent and
    # cannot be replaced until 845 blocks after it is sent. Only runs if disableTransforms is false.
    autoCommit = false
  }


  emission {
    # Enable emission transactions that allow you and other Lithos miners to gain LIT.
    enabled = true
    # How often to look at the head of the queue, in ms.
    queueInterval = 240000
    # How many emission spends to chain in one pass. Each respends the previous one's successor, so
    # this is how deep into the queue one pass reaches.
    maxQueueSpends = 4
    # How many Activates your own block candidate carries when there is no Clear to take. While the
    # active set is still filling, each one is about 7 KB of your block. A Clear in reach lifts this
    # to the emissions source's maxTxs.
    candidateActivates = 5
    # How many unconfirmed spends of the emission box to follow. Broadcasts always build on the
    # newest box; following the spends lets a queue pass activate queue boxes made by joins still in
    # the mempool. Boxes further along the chain are not seen until they confirm.
    maxChainDepth = 16
    # How many queue boxes to page through when looking for the head.
    queueScanLimit = 500
    # Fee on emission transactions, in nanoERG.
    txFee = 1000000

    # Self-Collateralization options:

    # Collateralize your own ERG and LIT into the queue. Once submitted, neither can be returned
    # until the box reaches the end of the queue and is used in a Lithos block.
    # WARNING: Enable at your own risk. Use the options below to bound your exposure.
    autoCollateralize = false
    # How often to check whether more collateral is wanted, in ms.
    collateralizeInterval = 900000
    # How many self-collateral boxes to create in one pass.
    maxJoinsPerRun = 5
    # How many of your boxes may be live at once, across the queue, live collateral and the active
    # set. Each locks 2.915 ERG plus its permit, so this is your total exposure.
    maxOwnCollateral = 10
    # How many wallet addresses may be dedicated to lending. One queue box per address.
    # Must not exceed node.numAddresses, or the extra addresses receive funds you cannot spend.
    maxLenderKeys = 32
    # Max LIT to post as a permit on one box, in base units (9 decimals). The permit is held on the
    # collateral box and returned when it is spent. It rises and falls with how much collateral is
    # already queued, between 2,000 LIT and the 40,000 LIT ceiling below.
    maxPermitPerJoin = 40000000000000
    # What each position adds above the 2.915 ERG floor, in nanoERG, so a position locks
    # 2.915 ERG + this. Part of it goes to whichever miner spends the collateral box and the rest to
    # the pool, which is what buys the position priority: a miner takes the box that pays it most,
    # so a position offering something is spent ahead of the ones offering nothing.
    # 0 posts at the floor and offers nothing. Anything else is at least 1000000 (0.001 ERG).
    # The 3 ERG block reward stops covering the principal past 85000000 (0.085 ERG), beyond which
    # the rest has to come out of the mined block's own transaction fees.
    priorityFeeNanoErgs = 0
  }

  # Lithos must synchronize with the blockchain in order to properly function.
  # Synchronization allows you to submit your work, get paid, and prevent fraud.
  sync {
    # Height that Lithos starts synchronizing from. Minimum 2: the seed reads the header below it.
    startHeight = 1888200
    # Canonical cursors kept to locate a fork in the transform journal. Deeper forks recover from a
    # retained snapshot instead. 200 matches the Ergo node's default keepVersions, the deepest rollback
    # the node itself can follow. Every fork reads one header per cursor from the node.
    cursorWindow = 200
    # AVL provers retained after lazy materialization. Metadata and journal transforms remain resident;
    # other dictionaries are reconstructed from a snapshot only when a block or consumer touches them.
    materializedDictionaryCacheEntries = 4
    # Whole blocks fetched per catch-up request. Larger batches reduce round trips, but every block
    # arrives with each of its input boxes in full, so the response grows with the blocks' contents.
    catchUpBatchBlocks = 16
    # How often the node is polled for new blocks. Largest single term in both node load and block
    # latency. Raise it for a remote or shared node.
    pollInterval = 5 seconds
    # Consecutive failures at one height before logging a stalled cursor. Retries continue afterward.
    retriesBeforeAlarm = 12
    # How often the committed header is re-read to notice a same-height fork
    # or a node whose header chain fell below this client's cursor.
    revalidationChecks = 30 seconds
    quarantine {
      # Rebuilds attempted from the indexed chain before a quarantined rollup is dropped for good,
      # Faults that re-reading cannot clear are dropped regardless.
      repairAttempts = 3
      # Terminal and retry-exhausted faults remain visible for this many committed blocks before
      # their diagnostic records are removed. Repairable faults do not age while waiting.
      retentionBlocks = 720
      # Freeze catch-up periodically so one rollup repair can finish and install at an exact cursor.
      # Disabling this favors catch-up throughput, but a long repair may not install until the tip.
      maintenanceCheckpoints = true
      # Committed catch-up blocks between maintenance checkpoints. At 1, every catch-up block pauses
      # for at least a quarantine-list round trip and, when a fault exists, a repair walk. Lower values
      # improve repair latency by trading away catch-up throughput.
      checkpointIntervalBlocks = 10
      # Maximum rollup spends followed during one indexed-chain rebuild. Each spend can require a box,
      # transaction, and canonical-header read, so a large value can hold catch-up until repairTimeout.
      maxTransforms = 100000
      # Maximum wall-clock time a quarantine walk may hold a maintenance checkpoint. On timeout,
      # catch-up resumes; the one worker remains exclusive and a late result must pass the old cursor.
      repairTimeout = 3 minutes
    }
    mempool {
      # Maximum unconfirmed rollup transactions in one complete view. Only transactions at a rollup
      # script are read, so this is far above any honest figure. Exceeding it disables mempool-aware
      # chaining until it drains; confirmed state and submission are unaffected.
      maxTransactions = 10000
      # How often the relevant mempool is re-read while synchronization is ready. Separate from
      # pollInterval because it trades submission freshness against node load, not block latency.
      refreshInterval = 5 seconds
    }
    minerDictionary {
      # Rebuild the dictionary from its singleton spend chain. Disable only when registration and
      # commitment-fraud proofs are intentionally unavailable.
      bootstrap = true
      # Maximum dictionary spends followed during bootstrap.
      maxTransforms = 100000
      # How often a failed bootstrap is retried. Until one succeeds this miner cannot register or
      # raise commitment fraud proofs; mining and submission to existing rollups are unaffected.
      repairInterval = 5 minutes
    }
    storage {
      # Backend-neutral repositories currently ship only the LevelDB adapter.
      backend = "leveldb"
      path = ".lithos/sync"
    }
    snapshots {
      enabled = true
      # Committed blocks between ordinary checkpoints. A checkpoint can intentionally lag the tip;
      # its retained volatile suffix bounds routine replay and preserves short-reorg responsiveness
      # at the cost of memory usage
      intervalBlocks = 10
      # Snapshot generations kept. At intervalBlocks = 10, 24 generations reach 240 blocks back.
      retention = 24
      # Largest single subtree/header/metadata entry. Dictionaries are content-addressed and streamed,
      # so this does not bound a complete dictionary or generation.
      maxEntryBytes = 67108864
    }
  }

  # How this client's wallet selects, bounds and maintains its own UTXOs.
  wallet {
    # Inputs one selection may take. Also the ceiling on a single consolidation.
    max-inputs = 75

    # The selection cache: how many box descriptors are held, and how much memory they may occupy.
    # A wallet of large boxes reaches the byte bound first.
    max-descriptors = 2048
    max-descriptor-bytes = 1048576

    # Largest box this client will hydrate. Anything above it is skipped, not fatal.
    max-input-bytes = 4096

    # Boxes per node read while walking the wallet.
    page-size = 500

    # Budget for one whole-inventory walk. It fails rather than returning a prefix, because a prefix
    # would misreport what the wallet holds and consolidation would act on the wrong total.
    inventory-walk-timeout-ms = 240000

    # How long a caller waits for funding, including a consolidation reserving the boxes it chose.
    # Funding is serialised on one thread, so this bounds the queue behind a slow node read rather than
    # the read itself. Raise it before raising the pool if joins are timing out on a busy node.
    reservation-timeout-ms = 30000

    # Options for the wallet's node client
    node-call-timeout-ms = 30000
    node-read-timeout-ms = 30000
    node-max-response-bytes = 2097152

    # Maximum amount of inputs which can be reserved for transactions at any point.
    max-wallet-inputs = 512
    # What portion of the inputs is allowed to be reserved for non-critical work.
    # Should be lower than max-wallet-inputs
    max-optional-inputs = 362

    # Merging this client's own wallet boxes. Uses the shared engine fee and transaction budgets, and
    # token boxes are always excluded. The lowest-priority work the engine does: it only runs when
    # nothing else is in flight, so the interval is a floor and not a schedule.
    consolidation {
      enabled = false
      # Wallet size to aim for. Above it one pass merges the excess; at or below it nothing happens.
      target-utxos = 500
      # Shortest gap between passes.
      interval-ms = 300000
      # Inputs a pass must be able to merge before it is worth a fee. Merging two boxes pays to remove
      # one, so anything below this is not worth building.
      min-inputs = 100
      # Number of consolidation transactions to do per pass
      num-transactions = 1
      # Longest one pass may take from being queued, including the wallet walk, signing and every send.
      # A pass past it fails with "consolidation attempt expired". Must be longer than
      # inventory-walk-timeout-ms, since a large wallet's walk alone can take that long.
      attempt-timeout-ms = 300000
      # How long a pass waits on the engine: for the inputs already in flight, a complete mempool
      # observation, and to pin a transaction's inputs before sending it.
      request-timeout-ms = 40000
    }
  }

  lithos-tasks {
    # Stratum Server task parameters
    stratum-server {
      enabled  = true
      startup  = 30 seconds
      interval = 30 seconds
    }
    rollup-sync-task {
        enabled  = true
        startup  = 10 seconds
        interval = 500 millis
    }
    # Registers and commits when state.autoCommit is on, and warns before the registration expires.
    # Runs at most once a minute.
    dictionary-sync-task {
        enabled  = true
        startup  = 60 seconds
        interval = 60 seconds
    }
  }
  lithos-contexts {
    # Candidate requests change the node's cached work. One worker serializes them, including
    # requests left running by an actor restart. Optional transaction workers cannot occupy it.
    # Optional engine preparation cannot consume NISP/fraud or mining worker capacity.
    wallet-io-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 1, task-queue-size = 4 }
      throughput = 1
    }
    # Inventory scans and reward sweeps have independent capacity from funding selection.
    wallet-maintenance-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 2, task-queue-size = 8 }
      throughput = 1
    }
    critical-wallet-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 1, task-queue-size = 4 }
      throughput = 1
    }
    critical-tx-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 2, task-queue-size = 4 }
      throughput = 1
    }
    engine-candidate-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 2, task-queue-size = 4 }
      throughput = 1
    }
    # Workers for ErgoDEX order discovery, broadcasts and candidate execution builds.
    batching-io-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 2, task-queue-size = 4 }
      throughput = 1
    }
    # The same for LithosDex. Separate, because a build blocks on a mempool walk for up to 40 seconds.
    lithosdex-batching-io-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 2, task-queue-size = 4 }
      throughput = 1
    }
    engine-io-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 1, task-queue-size = 4 }
      throughput = 1
    }
    mempool-io-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 1, task-queue-size = 4 }
      throughput = 1
    }
    candidate-io-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 1, task-queue-size = 4 }
      throughput = 1
    }
    # One chain observation and one solved-block submission may run concurrently. Neither waits
    # for candidate HTTP, wallet work, or optional transaction preparation.
    mining-control-io-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 2, task-queue-size = 4 }
      throughput = 1
    }
    # Collateral genesis signing has its own worker. Background collateral refresh and ordinary
    # transaction work cannot occupy it while cached inputs are ready for a new block.
    genesis-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 1, task-queue-size = 4 }
      throughput = 1
    }
    stratum-dispatcher {
      # Dispatcher is the name of the event-based dispatcher
      type = Dispatcher
      # What kind of ExecutionService to use
      executor = "fork-join-executor"
      # Configuration for the fork join pool
      fork-join-executor {
        # Min number of threads to cap factor-based parallelism number to
        parallelism-min = 4
        # Parallelism (threads) ... ceil(available processors * factor)
        parallelism-factor = 2.0
        # Max number of threads to cap factor-based parallelism number to
        parallelism-max = 16
        # Max number of additional threads to spawn by ManagedBlocker
        maximum-spare-threads = 16
      }
      # Throughput defines the maximum number of messages to be
      # processed per actor before the thread jumps to the next actor.
      # Set to 1 for as fair as possible.
      throughput = 1
    }
    polling-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 32
      }
      throughput = 1
    }
    sync-dispatcher {
      # Dispatcher is the name of the event-based dispatcher
      type = Dispatcher
      # What kind of ExecutionService to use
      executor = "fork-join-executor"
      # Configuration for the fork join pool
      fork-join-executor {
        # Min number of threads to cap factor-based parallelism number to
        parallelism-min = 2
        # Parallelism (threads) ... ceil(available processors * factor)
        parallelism-factor = 2.0
        # Max number of threads to cap factor-based parallelism number to
        parallelism-max = 10
        # Max number of additional threads to spawn by ManagedBlocker
        maximum-spare-threads = 16
      }
      # Throughput defines the maximum number of messages to be
      # processed per actor before the thread jumps to the next actor.
      # Set to 1 for as fair as possible.
      throughput = 100
    }
    tx-dispatcher {
          # Dispatcher is the name of the event-based dispatcher
          type = Dispatcher
          # What kind of ExecutionService to use
          executor = "fork-join-executor"
          # Configuration for the fork join pool
          fork-join-executor {
            # Min number of threads to cap factor-based parallelism number to
            parallelism-min = 2
            # Parallelism (threads) ... ceil(available processors * factor)
            parallelism-factor = 2.0
            # Max number of threads to cap factor-based parallelism number to
            parallelism-max = 10
            # Max number of additional threads to spawn by ManagedBlocker
            maximum-spare-threads = 16
          }
          # Throughput defines the maximum number of messages to be
          # processed per actor before the thread jumps to the next actor.
          # Set to 1 for as fair as possible.
          throughput = 10
        }
    # Serves live LithosDex endpoints that need blocking node IO: box scans, signing, and broadcasting.
    # Cached graph requests read StatsCache directly.
    dex-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 16
      }
      throughput = 1
    }
    database-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 2
      }
      throughput = 1
    }
    stats-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor.fixed-pool-size = 1
      throughput = 16
    }
    stats-read-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 1, task-queue-size = 1 }
      throughput = 1
    }
    stats-store-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 1, task-queue-size = 1 }
      throughput = 1
    }
    mining-stats-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor { fixed-pool-size = 1, task-queue-size = 1 }
      throughput = 1
    }
    # Snapshot serialization, reconstruction and restore may block in LevelDB or authenticated-map
    # replay. Keep that work off canonical polling. Four threads cover the one save, one restore and
    # two dictionary slots the actor can own; a bounded queue contains work left by an unexpected
    # actor restart when a backend call cannot be interrupted.
    snapshot-io-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 4
        task-queue-size = 4
      }
      throughput = 1
    }
  }
  akka {
    # Direct Akka to use Play's logging engine (which is SLF4J/Logback)
    loggers = ["akka.event.slf4j.Slf4jLogger"]

    # Set the Akka internal log level threshold (e.g., DEBUG, INFO, WARNING, ERROR)
    # Messages below this level will be ignored by Akka
    loglevel = "INFO"
  }

}
