# https://www.playframework.com/documentation/latest/Configuration
{

  node {
    url = "http://127.0.0.1"
    key = ""
    storagePath = ""
    pass        = ""
    networkType = "MAINNET"
    explorerURL = "default"
    # How many EIP-3 addresses this client holds keys for. This must be at least
    # emission.maxLenderKeys. Raising it later is safe; lowering it strands funds until you raise it
    # back. Costs a little startup time.
    numAddresses = 32
  }
  play.http.secret.key="changethissecret"
  # Blake2b256 hash of the API key. Replace the shipped development value.
  # in the same manner that you change your node's apiKeyHash. The current value is "hello"
  lithos.apiKeyHash="324dcf027dd4a30a932c441f365a25e86b173defa4b8e58948253471b81b72cf"

  play.server.akka.terminationTimeout = 30s

  stratum {
    diff = "4.0G" # Format diff as (value)(powTen), e.g "4.0G", "1.52M", "300.1K", etc.
    stratumPort = 4444
    # Value of 2 is recommended, as it gives a large nonce space your rigs can work through during a single job.
    # Increasing it may cause duplicate shares and extraNonce changes in your mining software.
    extraNonce1Size = 2

    # How many ms it takes for your no work submission before extra nonce is rotated. A value
    # of 0 disables rotations. Should not be needed unless extraNonce1Size is raised above 2.
    rotateExtraNonceInterval = 0

    connectionTimeout = 60000
    blockRefreshInterval = 1000
    reduceShareMessages    = true # Mining software will only send super-shares to the Lithos stratum

    # Force lithos stratum to use config difficulty.
    # NOTE: This could prevent you from submitting NISPs if your config difficulty is lower than
    # your difficulty commitment on the blockchain. Only recommended for testing out the
    # effects of different difficulty values.
    forceConfigDiff = false
    # How often difficulty should be refreshed from the current commitment state
    diffRefreshInterval = 60000


    # Options related to Lithos mining candidates
    candidate {
      # How many collateral boxes to keep pre-loaded. There is a maximum of 100 at any given moment.
      collateralPoolSize = 100
      # How often the collateral set is refreshed, in ms. Also refreshed on every new block.
      collateralRefreshInterval = 60000

      # Maximum amount of time to wait for genesis tx construction before a solo-candidate is sent out instead.
      genesisWaitMs = 1500
      # How often to refresh the current block candidate to check for mempool updates
      # If a new candidate is found, a new job is sent to the mining software.
      # This does not effect new jobs sent due to height changes, they are sent immediately
      mempoolRefreshMs = 10000

      # Insert additional non-genesis transactions into your blocks.
      # This includes Lithos related transactions (rollups, emissions) and potentially others (MEV, SR, etc).
      # Some transactions may already be in the mempool, so whichever copy lands first wins.
      # You do not pay fees for transactions included this way.
      # WARNING: Experimental, enable at your own risk at this time.
      blockTransactions = false
      # Max transactions to insert into a block. Each slot is block space not earning a fee, so keep it small.
      maxBlockTxs = 5
      # How long to wait for non-genesis transactions to be built, in ms.
      blockTxTimeout = 20000

      # Append how long each stage took to the candidate log lines: building the genesis transaction,
      # collecting the extra transactions, and the wait before miners are given the job.
      # Useful when a block seems slow to reach your rigs.
      logTimings = false
    }
  }

  state {
    # If set to true, this disables all transactions and interactions with LFSM rollups
    disableTransforms = false
    # Automatically update difficulty commitment whenever a difference is found between on-chain difficulty
    # and difficulty set in the config file. Only runs if disableTransforms is false.
    autoCommit = true
  }


  emission {
    # Enable emission transactions that allow you and other Lithos miners to gain LIT.
    enabled = true
    # How often to look at the head of the queue, in ms.
    queueInterval = 240000
    # How many emission spends to chain in one pass. Each respends the previous one's successor, so
    # this is how deep into the queue one pass reaches.
    maxQueueSpends = 4
    # Chain emission transactions in the mempool.
    mempoolChaining = true
    # How many unconfirmed spends to follow before falling back to confirmed state.
    maxChainDepth = 16
    # How many queue boxes to page through when looking for the head.
    queueScanLimit = 500
    # Fee on emission transactions, in nanoERG.
    txFee = 1000000

    # Self-Collateralization options:

    # Collateralize your own ERG and LIT into the queue. Once submitted, neither can be returned
    # until the box reaches the end of the queue and is used in a Lithos block.
    # WARNING: Enable at your own risk. Use the options below to bound your exposure.
    autoCollateralize = false
    # How often to check whether more collateral is wanted, in ms.
    collateralizeInterval = 900000
    # How many self-collateral boxes to create in one pass.
    maxJoinsPerRun = 5
    # How many of your boxes may be live at once, across the queue, live collateral and the active
    # set. Each locks 2.915 ERG plus its permit, so this is your total exposure.
    maxOwnCollateral = 10
    # How many wallet addresses may be dedicated to lending. One queue box per address.
    # Must not exceed node.numAddresses, or the extra addresses receive funds you cannot spend.
    maxLenderKeys = 32
    # Max LIT to post as a permit on one box, in base units (9 decimals). The permit is held on the
    # collateral box and returned when it is spent. It rises and falls with how much collateral is
    # already queued, between 1,000 LIT and the 30,000 LIT ceiling below.
    maxPermitPerJoin = 40000000000000
  }

  # Lithos must synchronize with the blockchain in order to properly function.
  # Synchronization allows you to submit your work, get paid, and prevent fraud.
  sync {
    # Height that Lithos starts synchronizing from. Minimum 2: the seed reads the header below it.
    startHeight = 520000
    # Canonical cursors kept to locate a fork in the transform journal or retained snapshots.
    # A cursor is about 100 bytes, so this is sized for fork-search reach rather than full-state
    # retention. The value is intentionally independent of the ordinary checkpoint interval.
    cursorWindow = 720
    # AVL provers retained after lazy materialization. Metadata and journal transforms remain resident;
    # other dictionaries are reconstructed from a snapshot only when a block or consumer touches them.
    materializedDictionaryCacheEntries = 4
    # Whole blocks fetched per catch-up request. Larger batches reduce round trips, but every block
    # arrives with each of its input boxes in full, so the response grows with the blocks' contents.
    catchUpBatchBlocks = 16
    # How often the node is polled for new blocks. Largest single term in both node load and block
    # latency. Raise it for a remote or shared node.
    pollInterval = 5 seconds
    # Consecutive failures at one height before logging a stalled cursor. Retries continue afterward.
    retriesBeforeAlarm = 12
    # How often the committed header is re-read to notice a same-height fork
    # or a node whose header chain fell below this client's cursor.
    revalidationChecks = 30 seconds
    quarantine {
      # Rebuilds attempted from the indexed chain before a quarantined rollup is dropped for good,
      # Faults that re-reading cannot clear are dropped regardless.
      repairAttempts = 3
      # Terminal and retry-exhausted faults remain visible for this many committed blocks before
      # their diagnostic records are removed. Repairable faults do not age while waiting.
      retentionBlocks = 720
      # Freeze catch-up periodically so one rollup repair can finish and install at an exact cursor.
      # Disabling this favors catch-up throughput, but a long repair may not install until the tip.
      maintenanceCheckpoints = true
      # Committed catch-up blocks between maintenance checkpoints. At 1, every catch-up block pauses
      # for at least a quarantine-list round trip and, when a fault exists, a repair walk. Lower values
      # improve repair latency by trading away catch-up throughput.
      checkpointIntervalBlocks = 10
      # Maximum rollup spends followed during one indexed-chain rebuild. Each spend can require a box,
      # transaction, and canonical-header read, so a large value can hold catch-up until repairTimeout.
      maxTransforms = 100000
      # Maximum wall-clock time a quarantine walk may hold a maintenance checkpoint. On timeout,
      # catch-up resumes; the one worker remains exclusive and a late result must pass the old cursor.
      repairTimeout = 3 minutes
    }
    mempool {
      # Maximum unconfirmed rollup transactions in one complete view. Only transactions at a rollup
      # script are read, so this is far above any honest figure. Exceeding it disables mempool-aware
      # chaining until it drains; confirmed state and submission are unaffected.
      maxTransactions = 10000
      # How often the relevant mempool is re-read while synchronization is ready. Separate from
      # pollInterval because it trades submission freshness against node load, not block latency.
      refreshInterval = 5 seconds
    }
    minerDictionary {
      # Rebuild the dictionary from its singleton spend chain. Disable only when registration and
      # commitment-fraud proofs are intentionally unavailable.
      bootstrap = true
      # Maximum dictionary spends followed during bootstrap.
      maxTransforms = 100000
      # How often a failed bootstrap is retried. Until one succeeds this miner cannot register or
      # raise commitment fraud proofs; mining and submission to existing rollups are unaffected.
      repairInterval = 5 minutes
    }
    storage {
      # Backend-neutral repositories currently ship only the LevelDB adapter.
      backend = "leveldb"
      path = ".lithos/sync"
    }
    snapshots {
      enabled = true
      # Committed blocks between ordinary checkpoints. A checkpoint can intentionally lag the tip;
      # its retained volatile suffix bounds routine replay and preserves short-reorg responsiveness
      # at the cost of memory usage
      intervalBlocks = 10
      # Number of snapshots to store (10*20 = historical snapshots spanning 240 blocks)
      retention = 24
      # Largest single subtree/header/metadata entry. Dictionaries are content-addressed and streamed,
      # so this does not bound a complete dictionary or generation.
      maxEntryBytes = 67108864
    }
  }

  lithos-tasks {
    # Stratum Server task parameters
    stratum-server {
      enabled  = true
      startup  = 30 seconds
      interval = 30 seconds
    }
    rollup-sync-task {
        enabled  = true
        startup  = 10 seconds
        interval = 500 millis
    }
    dictionary-sync-task {
        enabled  = true
        startup  = 5 seconds
        interval = 500 millis
    }
  }
  lithos-contexts {
    stratum-dispatcher {
      # Dispatcher is the name of the event-based dispatcher
      type = Dispatcher
      # What kind of ExecutionService to use
      executor = "fork-join-executor"
      # Configuration for the fork join pool
      fork-join-executor {
        # Min number of threads to cap factor-based parallelism number to
        parallelism-min = 4
        # Parallelism (threads) ... ceil(available processors * factor)
        parallelism-factor = 2.0
        # Max number of threads to cap factor-based parallelism number to
        parallelism-max = 16
        # Max number of additional threads to spawn by ManagedBlocker
        maximum-spare-threads = 16
      }
      # Throughput defines the maximum number of messages to be
      # processed per actor before the thread jumps to the next actor.
      # Set to 1 for as fair as possible.
      throughput = 1
    }
    polling-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 32
      }
      throughput = 1
    }
    sync-dispatcher {
      # Dispatcher is the name of the event-based dispatcher
      type = Dispatcher
      # What kind of ExecutionService to use
      executor = "fork-join-executor"
      # Configuration for the fork join pool
      fork-join-executor {
        # Min number of threads to cap factor-based parallelism number to
        parallelism-min = 2
        # Parallelism (threads) ... ceil(available processors * factor)
        parallelism-factor = 2.0
        # Max number of threads to cap factor-based parallelism number to
        parallelism-max = 10
        # Max number of additional threads to spawn by ManagedBlocker
        maximum-spare-threads = 16
      }
      # Throughput defines the maximum number of messages to be
      # processed per actor before the thread jumps to the next actor.
      # Set to 1 for as fair as possible.
      throughput = 100
    }
    tx-dispatcher {
          # Dispatcher is the name of the event-based dispatcher
          type = Dispatcher
          # What kind of ExecutionService to use
          executor = "fork-join-executor"
          # Configuration for the fork join pool
          fork-join-executor {
            # Min number of threads to cap factor-based parallelism number to
            parallelism-min = 2
            # Parallelism (threads) ... ceil(available processors * factor)
            parallelism-factor = 2.0
            # Max number of threads to cap factor-based parallelism number to
            parallelism-max = 10
            # Max number of additional threads to spawn by ManagedBlocker
            maximum-spare-threads = 16
          }
          # Throughput defines the maximum number of messages to be
          # processed per actor before the thread jumps to the next actor.
          # Set to 1 for as fair as possible.
          throughput = 10
        }
    # Serves the local LithosDex HTTP endpoints, which do blocking node IO on every request: box
    # scans, signing, and broadcasting.
    dex-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 16
      }
      throughput = 1
    }
    database-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 2
      }
      throughput = 1
    }
    # Snapshot serialization, reconstruction and restore may block in LevelDB or authenticated-map
    # replay. Keep that work off canonical polling. Four threads cover the one save, one restore and
    # two dictionary slots the actor can own; a bounded queue contains work left by an unexpected
    # actor restart when a backend call cannot be interrupted.
    snapshot-io-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 4
        task-queue-size = 4
      }
      throughput = 1
    }
  }
  akka {
    # Direct Akka to use Play's logging engine (which is SLF4J/Logback)
    loggers = ["akka.event.slf4j.Slf4jLogger"]

    # Set the Akka internal log level threshold (e.g., DEBUG, INFO, WARNING, ERROR)
    # Messages below this level will be ignored by Akka
    loglevel = "INFO"
  }
}
