# Defaults for settings added to application.conf since 1.0.6, so a lithos.conf that includes an older
# release's application.conf still starts. Anything set in application.conf or lithos.conf wins over these.
# Each value here must equal the one application.conf ships; change both together.
lithos-contexts {
  # Arb cycle builds: one runs at a time.
  arb-io-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"
    thread-pool-executor { fixed-pool-size = 2, task-queue-size = 4 }
    throughput = 1
  }
  # Follows the pool boxes batching and arb build on, one block at a time: one advance runs at a time.
  pool-tracking-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"
    thread-pool-executor { fixed-pool-size = 1, task-queue-size = 8 }
    throughput = 1
  }
  # SigmaFi ZC batching builds and broadcasts.
  sigmafi-batching-io-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"
    thread-pool-executor { fixed-pool-size = 2, task-queue-size = 4 }
    throughput = 1
  }
}
