openapi: 3.0.0
servers:
  - url: http://localhost:9000
    description: Lithos Client API
info:
  description: |
    API Documentation for the Lithos client. Models used
    here are expected to be consistent across any other implementations of the Lithos client.

  version: 1.0.0
  title: Lithos Client API
  contact:
    url: https://github.com/Lithos-Protocol
tags:
  - name: info
    description: Information about the Lithos client and state
    x-displayName: Info
  - name: blocks
    description: Blocks currently being processed by Lithos contracts
    x-displayName: Blocks
  - name: payments
    description: Payments made to you from Lithos contracts
    x-displayName: Payments
  - name: mining
    description: Information about the local stratum and mining process
    x-displayName: Mining
  - name: collateral
    description: Find and interact with collateral UTXOs 
    x-displayName: Collateral
  - name: pool_block_model
    x-displayName: The PoolBlock Model
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/PoolBlock" />
  - name: collateral_utxo_model
    x-displayName: The CollateralUTXO Model
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/CollateralUTXO" />
  - name: lithosdex
    description: >
      Swap, provide liquidity and collect fees on the LithosDex pool.


      **All amounts are decimal strings, not JSON numbers.** A 409 means a box you quoted against
      has moved: re-read, re-quote and resend.
    x-displayName: Lithos Dex
x-tagGroups:
  - name: Lithos
    tags:
      - info
      - blocks
      - payments
      - collateral
      - lithosdex
  - name: Stratum
    tags:
      - mining
  - name: Models
    tags:
      - pool_block_model
      - collateral_utxo_model
paths:
  /blocks:
    get:
      summary: List UTXO ids for blocks
      description: Get an array of UTXO ids (hex encoded) representing contracts currently processing Lithos blocks.
        Returns a page of the whole list starting from `offset` and containing `limit` items.
      operationId: getContractIds
      tags:
        - blocks
      parameters:
        - in: query
          name: limit
          required: false
          description: The number of items in list to return
          schema:
            type: integer
            format: int32
            minimum: 10
            maximum: 100
            default: 50
        - in: query
          name: offset
          required: false
          description: The offset to start the list from
          schema:
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: Array of UTXO ids
          content:
            application/json:
              schema:
                type: array
                description: Array of UTXO ids
                items:
                  type: string
                  example: '88c297f99da7172f6aa20efbead69aa40e2b7734a1873d66ca1db6b19d214db6'
                example: ['88c297f99da7172f6aa20efbead69aa40e2b7734a1873d66ca1db6b19d214db6']
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /blocks/byHeight:
    get:
      summary: UTXO ids by block height
      description: Get UTXO ids of Lithos contracts for blocks mined in a range of heights
      operationId: getBlocksByHeight
      tags:
        - blocks
      parameters:
        - in: query
          name: fromHeight
          required: false
          description: Min height (start of the range) to look for Lithos blocks
          schema:
            type: integer
            format: int32
            default: 0
        - in: query
          name: toHeight
          required: false
          description: Max height of the range (exclusive)
          schema:
            type: integer
            format: int32
            default: -1
      responses:
        '200':
          description: Array of UTXO ids
          content:
            application/json:
              schema:
                type: array
                example: ['88c297f99da7172f6aa20efbead69aa40e2b7734a1873d66ca1db6b19d214db6']
                items:
                  type: string
                  example: '88c297f99da7172f6aa20efbead69aa40e2b7734a1873d66ca1db6b19d214db6'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /blocks/{utxoId}:
    get:
      summary: Block info by UTXO id
      description: Get information about a specific pool block being processed by a Lithos rollup contract
      operationId: getBlockById
      tags:
        - blocks
      parameters:
        - in: path
          name: utxoId
          required: true
          description: Id of the UTXO representing a Lithos block
          schema:
            type: string
      responses:
        '200':
          description: Pool block object which shows information about the given Lithos block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolBlock'
        '404':
          description: UTXO with this id doesn't exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /blocks/utxoIds:
    post:
      summary: Block info for multiple UTXO ids
      description: Get pool blocks by given UTXO ids
      operationId: getPoolBlocksByIds
      tags:
        - blocks
      requestBody:
          required: true
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: '88c297f99da7172f6aa20efbead69aa40e2b7734a1873d66ca1db6b19d214db6'
      responses:
        '200':
          description: Pool blocks corresponding to ids provided
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoolBlock'
        '404':
          description: Not all ids correspond to an existing pool block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /blocks/{utxoId}/miners:
    get:
      summary: Get a block's miner set
      description: Get information of miners associated with this pool block
      operationId: getBlockMinersById
      tags:
        - blocks
      parameters:
        - in: path
          name: utxoId
          required: true
          description: UTXO id of the pool block whose miners are being queried
          schema:
            type: string
      responses:
        '200':
          description: Block Miners object
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockMiners'
        '404':
          description: Could not find pool block with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /blocks/all:
    get:
      summary: List all pool blocks
      description: List all pool blocks being processed by Lithos rollup contracts.
       Returns a page of the whole list starting from `offset` and containing `limit` items.
      operationId: getAllPoolBlocks
      tags:
        - blocks
      parameters:
        - in: query
          name: limit
          required: false
          description: The number of items in list to return
          schema:
            type: integer
            format: int32
            minimum: 10
            maximum: 100
            default: 50
        - in: query
          name: offset
          required: false
          description: The offset to start the list from
          schema:
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: List of pool block objects describing all tracked LFSM rollups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoolBlock'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /payments:
    get:
      description: Get a list of payment transactions sent to you from Lithos contracts. Returns a page of the whole
        list starting from `offset` and containing `limit` items.
      summary: Get Lithos payouts
      security:
        - ApiKeyAuth: [api_key]
      operationId: getPayments
      tags:
        - payments
      parameters:
        - in: query
          name: limit
          required: false
          description: The number of items in list to return
          schema:
            type: integer
            format: int32
            minimum: 10
            maximum: 100
            default: 50
        - in: query
          name: offset
          required: false
          description: The offset to start the list from
          schema:
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: Array of Payment Transaction objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentTransaction'
        '404':
          description: Could not find any Lithos block payments for your mining address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /info:
    get:
      description: Get information about the Lithos client and the current LFSM state
      summary: Lithos client information
      operationId: getLithosInfo
      tags:
        - info
      responses:
        '200':
          description: Lithos info object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LithosInfo'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /mining:
    get:
      description: Information about the Lithos stratum
      summary: Get Stratum information
      operationId: getStratumInfo
      tags:
        - mining
      responses:
        '200':
          description: Information about the Stratum server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StratumInfo'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /mining/bestNISP:
    get:
      description: Returns the best NISP produced for a given height and score, with exactly 10 super-shares
      summary: Get best NISP at height
      operationId: getBestNISPAtHeight
      security:
        - ApiKeyAuth: [api_key]
      tags:
        - mining
      parameters:
        - in: query
          name: height
          required: true
          description: Height that all super shares in the NISP must be below
          schema:
            type: integer
            format: int32
            default: 0
        - in: query
          name: score
          required: true
          description: Score that all super shares in this NISP must be above
          schema:
            type: integer
            format: int64
            default: 5000000
      responses:
        '200':
          description: Best NISP representation with 10 super shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NISPRepresentation'
        '404':
          description: Could not produce a NISP for the given height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /collateral/all:
    get:
      summary: List all collateral UTXOs
      description: Get list of collateral UTXOs which will be used by Lithos while mining.
       Returns a page of the whole list starting from `offset` and containing `limit` items.
      operationId: getAllCollateralInfo
      tags:
        - collateral
      parameters:
        - in: query
          name: limit
          required: false
          description: The number of items in list to return
          schema:
            type: integer
            format: int32
            minimum: 10
            maximum: 100
            default: 50
        - in: query
          name: offset
          required: false
          description: The offset to start the list from
          schema:
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: Array of collateral UTXOs
          content:
            application/json:
              schema:
                type: array
                description: Array of collateral UTXOs
                items:
                  $ref: '#/components/schemas/CollateralUTXO'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /collateral/local:
    get:
      security:
        - ApiKeyAuth: [api_key]
      summary: List personal collateral UTXOs
      description: Get the list of collateral UTXOs made by you. Returns a page of the whole list
       starting from `offset` and containing `limit` items.
      operationId: getLocalCollateralInfo
      tags:
        - collateral
      parameters:
        - in: query
          name: limit
          required: false
          description: The number of items in list to return
          schema:
            type: integer
            format: int32
            minimum: 10
            maximum: 100
            default: 50
        - in: query
          name: offset
          required: false
          description: The offset to start the list from
          schema:
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: Array of collateral UTXOs
          content:
            application/json:
              schema:
                type: array
                description: Array of collateral UTXOs
                items:
                  $ref: '#/components/schemas/CollateralUTXO'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /dex/pool:
    get:
      summary: LithosDex pool state
      description: >
        Current state of the LithosDex pool. `reservesX` / `reservesY` are tradable; `pendingX` /
        `pendingY` are fees awaiting a flush.
      operationId: getLDPool
      tags:
        - lithosdex
      responses:
        '200':
          description: Current pool state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDPoolInfo'
        '404':
          description: No pool box found on this network.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/vault:
    get:
      summary: LithosDex fee vault state
      description: >
        Current state of the fee vault, which holds flushed fees. `payableX` excludes `vaultMin`,
        which is never paid out.
      operationId: getLDVault
      tags:
        - lithosdex
      responses:
        '200':
          description: Current vault state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDVaultInfo'
        '404':
          description: No vault box found on this network.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/swap/check:
    post:
      summary: Quote a swap
      description: >
        Quote a swap without sending a transaction. `protocolFee` goes to liquidity providers;
        `ammFee` stays in the pool.
      operationId: checkLDSwap
      tags:
        - lithosdex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDSwapRequest'
      responses:
        '200':
          description: Quote for the requested swap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDSwapQuote'
        '400':
          description: Malformed body, or a non-positive amount.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/swap/checkOutput:
    post:
      summary: Quote a swap by desired output
      description: >
        The reverse quote — what must go in for `amountOut` to come out. Returns 422 when the pool
        cannot produce that much.
      operationId: checkLDSwapOutput
      tags:
        - lithosdex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDSwapOutputRequest'
      responses:
        '200':
          description: Quote for the requested output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDSwapQuote'
        '400':
          description: Malformed body, or a non-positive amount.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Pool cannot produce the requested output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/swap:
    post:
      summary: Execute a swap
      description: >
        Sign and submit a swap. `minOutput` is required and rejects the trade if the pool has
        moved against you; send `expectedPoolBoxId` from the quote to get a 409 instead of a re-quote.
      operationId: ldSwap
      security:
        - ApiKeyAuth: [api_key]
      tags:
        - lithosdex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDSwapExecuteRequest'
      responses:
        '200':
          description: Result of the swap transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDSwapResult'
        '400':
          description: Malformed body, a non-positive `amountIn`, or a negative `minOutput`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The pool moved. Re-read and quote again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDStateChangedResponse'
        '422':
          description: The pool cannot fill this swap, or the wallet cannot cover it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node or wallet unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/deposit/check:
    post:
      summary: Quote a liquidity deposit
      description: >
        Quote a deposit. Supply `availableX` and `availableY` for the most shares those funds buy, or
        `shares` for the cheapest deposit that buys exactly that many.
      operationId: checkLDDeposit
      tags:
        - lithosdex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDDepositRequest'
      responses:
        '200':
          description: Quote for the requested deposit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDDepositQuote'
        '400':
          description: Supply either `shares`, or both `availableX` and `availableY`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/deposit:
    post:
      summary: Deposit liquidity
      description: >
        Deposit a balanced pair and mint a provision. Send `maxAmountX` / `maxAmountY` from the quote
        to cap what it costs if the pool moves. Keep the returned `ownerNFT` — it is what owns the
        provision.
      operationId: ldDeposit
      security:
        - ApiKeyAuth: [api_key]
      tags:
        - lithosdex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDDepositExecuteRequest'
      responses:
        '200':
          description: Result of the deposit transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDDepositResult'
        '400':
          description: Malformed body, or a non-positive `shares`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The pool moved. Re-read and quote again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDStateChangedResponse'
        '422':
          description: Costs more than the given bounds, or the wallet cannot cover it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node or wallet unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/redeem/check:
    post:
      summary: Quote a liquidity redemption
      description: >
        Quote closing a provision. `amountX` / `amountY` are the liquidity only; `unclaimedX` /
        `unclaimedY` are fees that would be lost if the provision is spent without claiming.
      operationId: checkLDRedeem
      tags:
        - lithosdex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDRedeemRequest'
      responses:
        '200':
          description: Quote for the requested redemption
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDRedeemQuote'
        '400':
          description: Malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No live provision with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The provision moved. Re-read to find its current box id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDStateChangedResponse'
        '503':
          description: Node unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/redeem:
    post:
      summary: Redeem liquidity
      description: >
        Close a provision and return its share of the reserves. **Unclaimed fees are lost when the
        provision is spent** — claim them first, or set `acknowledgeUnclaimedFees` to accept that.
      operationId: ldRedeem
      security:
        - ApiKeyAuth: [api_key]
      tags:
        - lithosdex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDRedeemRequest'
      responses:
        '200':
          description: Result of the redemption transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDRedeemResult'
        '400':
          description: >
            Malformed body, or the provision has unclaimed fees and `acknowledgeUnclaimedFees`
            was not set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No live provision with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The pool or provision moved. Re-read and quote again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDStateChangedResponse'
        '422':
          description: Returns less than the given bounds, or the pool refuses the redemption.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node or wallet unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/provisions:
    get:
      summary: List liquidity provisions
      description: >
        Every provision held by this wallet. `accrued*` is what it has earned, `claimable*` is what
        can be paid now, and `unflushed*` is the difference a flush would release.
      operationId: listLDProvisions
      tags:
        - lithosdex
      responses:
        '200':
          description: Provisions held by this wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDProvisionList'
        '503':
          description: Node or wallet unavailable. Never returns a partial list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/provisions/{boxId}/claim:
    post:
      summary: Claim settled fees for a provision
      description: >
        Pay out a provision's settled fees without changing its size. The provision gets a new box id
        — use `successorBoxId` from the response next. The body is optional.
      operationId: claimLDProvision
      security:
        - ApiKeyAuth: [api_key]
      tags:
        - lithosdex
      parameters:
        - in: path
          name: boxId
          required: true
          description: UTXO id of the provision box
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDClaimRequest'
      responses:
        '200':
          description: Result of the claim transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDClaimResult'
        '400':
          description: Nothing to settle for this provision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No live provision with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The vault or provision moved. Re-read and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDStateChangedResponse'
        '422':
          description: Settles less than the given bounds, or the vault cannot cover it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node or wallet unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/provisions/{boxId}/resize/check:
    post:
      summary: Quote a provision resize
      description: >
        Quote changing a provision's size without closing it. A resize also flushes pending fees.
      operationId: checkLDResize
      tags:
        - lithosdex
      parameters:
        - in: path
          name: boxId
          required: true
          description: UTXO id of the provision box
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDResizeRequest'
      responses:
        '200':
          description: Quote for the requested resize
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDResizeQuote'
        '400':
          description: Malformed body, or `newShares` is not a different positive size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No live provision with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The provision moved. Re-read to find its current box id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDStateChangedResponse'
        '503':
          description: Node unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/provisions/{boxId}/resize:
    post:
      summary: Resize a provision
      description: >
        Change a provision's size without closing it. Bound it with `maxAmountX` / `maxAmountY` when
        increasing or `minAmountX` / `minAmountY` when decreasing. The provision gets a new box id,
        returned as `boxId`.
      operationId: ldResize
      security:
        - ApiKeyAuth: [api_key]
      tags:
        - lithosdex
      parameters:
        - in: path
          name: boxId
          required: true
          description: UTXO id of the provision box
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDResizeRequest'
      responses:
        '200':
          description: Result of the resize transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDResizeResult'
        '400':
          description: Malformed body, or `newShares` is not a different positive size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No live provision with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The pool, vault or provision moved. Re-read and quote again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDStateChangedResponse'
        '422':
          description: Falls outside the given bounds, or the pool refuses the resize.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node or wallet unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/flush/check:
    post:
      summary: Check a pending fee flush
      description: >
        Preview moving the pool's pending fees into the vault. The gap between the pool's and the
        vault's accumulators is what a flush would release.
      operationId: checkLDFlush
      tags:
        - lithosdex
      responses:
        '200':
          description: State of a prospective flush
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDFlushCheck'
        '503':
          description: Node unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/flush:
    post:
      summary: Flush pending fees to the vault
      description: >
        Move the pool's pending fees into the vault, making them claimable. Anyone may call it and it
        pays the caller nothing. Returns 400 when nothing is pending. The body is optional.
      operationId: ldFlush
      security:
        - ApiKeyAuth: [api_key]
      tags:
        - lithosdex
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDFlushRequest'
      responses:
        '200':
          description: Result of the flush transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDFlushResult'
        '400':
          description: Nothing pending to flush.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The pool or vault moved. Re-read and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDStateChangedResponse'
        '422':
          description: The wallet cannot cover the network fee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node or wallet unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/fees/history:
    get:
      summary: Pool-wide fee history
      description: >
        Cumulative fees taken by the pool, bucketed by height. The default bucket of 720 blocks is
        roughly a day. Check `partial` — the series may not reach back to the pool's start.
      operationId: getLDFeeHistory
      tags:
        - lithosdex
      parameters:
        - in: query
          name: from
          required: false
          description: First block height to include
          schema:
            type: integer
            format: int32
        - in: query
          name: to
          required: false
          description: Last block height to include
          schema:
            type: integer
            format: int32
        - in: query
          name: bucket
          required: false
          description: Bucket size in blocks
          schema:
            type: integer
            format: int32
            default: 720
      responses:
        '200':
          description: Bucketed fee history for the pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDFeeHistory'
        '400':
          description: No pool history indexed, or an invalid range or bucket size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Node unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dex/provisions/{boxId}/fees/history:
    get:
      summary: Fee history for one provision
      description: >
        Earnings over time for one provision, from its current size and entry. Earnings from before a
        resize are not reconstructed.
      operationId: getLDProvisionFeeHistory
      tags:
        - lithosdex
      parameters:
        - in: path
          name: boxId
          required: true
          description: UTXO id of the provision box
          schema:
            type: string
        - in: query
          name: from
          required: false
          description: First block height to include
          schema:
            type: integer
            format: int32
        - in: query
          name: to
          required: false
          description: Last block height to include
          schema:
            type: integer
            format: int32
        - in: query
          name: bucket
          required: false
          description: Bucket size in blocks
          schema:
            type: integer
            format: int32
            default: 720
      responses:
        '200':
          description: Bucketed fee history for the provision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDProvisionFeeHistory'
        '400':
          description: No pool history indexed, or an invalid range or bucket size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No live provision with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The provision moved. Re-read to find its current box id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LDStateChangedResponse'
        '503':
          description: Node unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /wallet/balance:
    get:
      summary: Wallet balance
      description: >
        ERG and token balances for the client's wallet.
      operationId: getWalletBalance
      tags:
        - lithosdex
      responses:
        '200':
          description: Current wallet balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalance'
        '503':
          description: Wallet unavailable — it may be locked. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /collateral/create:
    post:
      summary: Create new collateral UTXOs
      security:
        - ApiKeyAuth: [api_key]
      description: Create new collateral UTXOs which will be used by Lithos miners
      operationId: createCollateralUTXO
      tags:
        - collateral
      requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollateralInfo'
      responses:
        '200':
          description: Successful transaction to create collateral UTXOs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulTransaction'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    ApiError:
      description: Error response from API
      type: object
      required:
        - error
        - reason
        - detail
      properties:
        error:
          type: integer
          description: Error code
          example: 500
        reason:
          type: string
          description: Error message explaining the reason of the error
          example: 'Internal server error'
        detail:
          type: string
          nullable: true
          description: Detailed error description
    PoolBlock:
      description: Information about block mined by Lithos pool contracts
      type: object
      x-tags: blocks
      required:
        - utxoId
        - blockId
        - blockHeight
        - numMiners
        - phase
      properties:
        utxoId:
          type: string
          description: UTXO id of Lithos contract currently processing this block
          example: '88c297f99da7172f6aa20efbead69aa40e2b7734a1873d66ca1db6b19d214db6'
        blockId:
          type: string
          description: Header id associated with this block
          example: '2a7de28034ca523685d9a03c30d06c36863a804f69c2e4add4d83c8c2ba26271'
        blockHeight:
          type: integer
          format: int32
          description: Height of this Lithos-mined block
          example: 42853
        numMiners:
          type: integer
          format: int32
          description: Number of miners which are currently being processed by this Lithos pool contract
          example: 12
        phase:
          type: string
          description: Current LFSM phase of the associated Lithos contract
          example: 'HOLDING'
    BlockMiners:
      description: Miner information associated with a Lithos block
      type: object
      x-tags: blocks
      required:
        - propBytesHash
      properties:
        propBytesHash:
          type: string
          description: Hexadecimal representation of hashed proposition bytes of the miner
          example: '56002fb6194f8a7f147b54c98c98bd72205f46c35fed0f3c4111071ecb0763b7'
    PaymentTransaction:
      description: Transaction paid to miner by Lithos payout contract
      type: object
      x-tags: payments
      required:
        - transactionId
        - payoutUTXO
        - amount
        - score
        - paymentHeight
        - blockId
        - minedBlockHeight
      properties:
        transactionId:
          type: string
          description: Transaction Id of this mining reward payment
          example: 'c42513da4dc695dbac3fb13482b604b289c9f1d39355e2e839899ed57780d9ab'
        payoutUTXO:
          type: string
          description: UTXO id of the Lithos payout contract associated with this payment
          example: '5035b2e112b4f5b873dd3444c01df1e7e697807fd84fe96790eacb128e46428d'
        amount:
          type: integer
          format: int64
          description: Amount of ERG paid to miner
          example: 67500000000
        score:
          type: integer
          format: int64
          description: Score associated with this miner's NISP, used to determine payout amount
          example: 5000000
        paymentHeight:
          type: integer
          format: int32
          description: Height that this payment was sent to miner
          example: 47832
        blockId:
          type: string
          description: Id of the block processed by Lithos and associated with this reward
          example: 'd5bb8d6fcb179a427e21b7ad68ec9148916aac7604f75c642acc1c3e28bd4c59'
        minedBlockHeight:
          type: integer
          format: int32
          description: Height of the block processed by Lithos, and associated with this reward.
          example: 47112
    LithosInfo:
      description: Information about this Lithos client and the current LFSM state
      type: object
      x-tags: info
      required:
        - numPoolBlocks
        - synced
      properties:
        numPoolBlocks:
          type: integer
          description: Number of tracked blocks currently being processed by Lithos contracts
          example: 64
        synced:
          type: boolean
          description: Whether this Lithos client has synced to the blockchain
          example: true
    StratumInfo:
      description: Information about the Stratum server
      type: object
      x-tags: mining
      required:
        - diff
        - tau
        - reducedMessaging
        - superSharesPerHour
      properties:
        diff:
          type: string
          description: Difficulty used for Lithos calculations
          example: '4.0G'
        tau:
          type: integer
          description: Tau representation of the mining diff
          example: 11579208923731619542357098500868790785326998466564056403945758400791312963993
        reducedMessaging:
          type: boolean
          description: Whether the stratum server has the `reduceShareMessages` setting enabled
          example: false
        superSharesPerHour:
          type: double
          description: Number of super shares produced by the mining client within the last hour
          example: 2.5
    CollateralUTXO:
      description: Collateral UTXO which is to be used by Lithos while mining
      type: object
      x-tags: collateral
      required:
        - id
        - reward
        - lender
        - fee
        - creationHeight
      properties:
        id:
          type: string
          description: Id of this collateral UTXO
          example: 'ce00d6e0f4fd3390c0519bb0d24824e1e6b06978163f4845a7cf2c1c7d8f1b65'
        reward:
          type: integer
          format: int64
          description: Block reward this collateral UTXO covers
          example: 67500000000
        lender:
          type: string
          description: Address of lender who created this collateral UTXO
          example: '3WwbQFz3vgi8ChY9dM1haQLGDeQYe5U9z98bwWW4TqxxEAvyYu5y'
        fee:
          type: integer
          format: int64
          description: Fee that this collateral UTXO charges from the entire pool
          example: 1000000
        creationHeight:
          type: integer
          description: Height this collateral UTXO was made
          example: 41482
    CollateralInfo:
      description: Information needed to create collateral UTXOs
      type: object
      x-tags: collateral
      required:
        - reward
        - fee
        - numUtxos
      properties:
        reward:
          type: integer
          format: int64
          description: Block reward this collateral UTXO covers
          example: 67500000000
        fee:
          type: integer
          format: int64
          description: Fee that this collateral UTXO charges from the entire pool
          example: 1000000
        numUtxos:
          type: integer
          format: int32
          description: Number of collateral UTXOs to create in this transaction
          example: 5
    
    SuccessfulTransaction:
      description: Transaction which was successfully sent to the node
      type: object
      required:
        - txId
        - height
      properties:
        txId:
          type: string
          description: Hex-encoded id of this transaction
          example: '40b7d045a858d537cdbf072e46ffbb86c0c9f6b0e93c369c1ffcba76797636d7'
        height:
          type: integer
          format: int32
          description: Height this transaction was sent
          example: 45096
    LDStateChangedResponse:
      description: >
        409 body. A box this request was quoted against has moved. Carries the ids as they now
        stand; only the ones that apply are present.
      type: object
      x-tags: lithosdex
      required:
        - error
        - reason
        - detail
      properties:
        error:
          type: integer
          example: 409
        reason:
          type: string
          example: 'State changed'
        detail:
          type: string
          description: What moved, and what it moved to
          example: 'the pool has moved: quoted against de..de, now a1f4..3d97'
        poolBoxId:
          type: string
          description: Current pool box id
          example: 'a1f4c2e8b7d93052416fbc8e07d21935a8c4f60b2e91d7385c06a4b1f2e83d97'
        vaultBoxId:
          type: string
          description: Current vault box id
          example: '88c297f99da7172f6aa20efbead69aa40e2b7734a1873d66ca1db6b19d214db6'
        provisionBoxId:
          type: string
          description: Current provision box id
          example: 'ce00d6e0f4fd3390c0519bb0d24824e1e6b06978163f4845a7cf2c1c7d8f1b65'

    LDFeeParams:
      description: >
        Fee numerators over `feeDenom`. `dexFeeNum` stays in the pool; `ergFeeNum` / `tokenFeeNum`
        are set aside for liquidity providers.
      type: object
      x-tags: lithosdex
      required:
        - dexFeeNum
        - ergFeeNum
        - tokenFeeNum
        - feeDenom
      properties:
        dexFeeNum:
          type: integer
          format: int64
          example: 9985
        ergFeeNum:
          type: integer
          format: int64
          example: 15
        tokenFeeNum:
          type: integer
          format: int64
          example: 15
        feeDenom:
          type: integer
          format: int64
          description: Denominator of every numerator above
          example: 10000

    LDPoolInfo:
      description: State of the LithosDex liquidity pool box
      type: object
      x-tags: lithosdex
      required:
        - poolNFT
        - utxoId
        - tokenY
        - reservesX
        - reservesY
        - pendingX
        - pendingY
        - supply
        - feeParams
        - accX
        - accY
        - provTokensLeft
        - canFlush
        - canDeposit
        - syncHeight
      properties:
        poolNFT:
          type: string
          description: Token id of the pool NFT
          example: '720933ab10ef28eafd96a4e41f783c12b444ed81d6a08879f583266031c04dbd'
        utxoId:
          type: string
          description: Pool box id. Send back as `expectedPoolBoxId` when executing.
          example: 'a1f4c2e8b7d93052416fbc8e07d21935a8c4f60b2e91d7385c06a4b1f2e83d97'
        tokenY:
          type: string
          description: Token id of the pool's token side
          example: '86e272f770aa4ef48ad7e6d6dbe98b5069edd8383a403a8edb3ceed8a3d5cea3'
        tokenName:
          type: string
          description: Display name of the pool's token, when known
          example: 'LIT'
        tokenDecimals:
          type: integer
          format: int32
          description: Decimal places implied by raw token amounts
          example: 4
        reservesX:
          type: string
          description: nanoERG the AMM trades with — box value less pendingX. Decimal string.
          example: '4250000000000'
        reservesY:
          type: string
          description: Raw token units the AMM trades with — token balance less pendingY. Decimal string.
          example: '128400000000'
        pendingX:
          type: string
          description: nanoERG fees accrued but not yet flushed to the vault. Decimal string.
          example: '3180000000'
        pendingY:
          type: string
          description: Token-side fees accrued but not yet flushed. Decimal string.
          example: '96400000'
        supply:
          type: string
          description: LP shares outstanding. Decimal string.
          example: '1000000000000'
        feeParams:
          $ref: '#/components/schemas/LDFeeParams'
        accX:
          type: string
          description: >
            Cumulative ERG fee per share, scaled by 1e27. Decimal string — this value exceeds the
            exact range of a double and must not be parsed as a JSON number.
          example: '41820000000000000000000000'
        accY:
          type: string
          description: Cumulative token fee per share, same 1e27 scale. Decimal string.
          example: '1264000000000000000000000'
        provTokensLeft:
          type: string
          description: >
            Provision tokens left in the pool; one is used per deposit. Decimal string.
          example: '999999999999997'
        canFlush:
          type: boolean
          description: Whether any fees are pending. A flush needs something to move.
          example: true
        canDeposit:
          type: boolean
          description: Whether a provision token remains to hand out
          example: true
        syncHeight:
          type: integer
          format: int32
          description: Block height this snapshot was taken at
          example: 1312460

    LDVaultInfo:
      description: State of the LithosDex fee vault
      type: object
      x-tags: lithosdex
      required:
        - vaultNFT
        - utxoId
        - accX
        - accY
        - balanceX
        - balanceY
        - payableX
        - payableY
        - vaultMin
        - syncHeight
      properties:
        vaultNFT:
          type: string
          description: Token id of the vault NFT
          example: '670a188c61b803a5ef12fedb2eb4ed7ab7b1eba1df9787f780a122bf3875781d'
        utxoId:
          type: string
          description: Vault box id. Send back as `expectedVaultBoxId` when executing.
          example: '88c297f99da7172f6aa20efbead69aa40e2b7734a1873d66ca1db6b19d214db6'
        accX:
          type: string
          description: The pool's ERG accumulator as of the last flush. Decimal string.
          example: '38640000000000000000000000'
        accY:
          type: string
          description: Token side of the same. Decimal string.
          example: '1167600000000000000000000'
        balanceX:
          type: string
          description: Total nanoERG held by the vault box, including the rent reserve. Decimal string.
          example: '9420000000'
        balanceY:
          type: string
          description: Token-side fees held. Zero until a flush carries any. Decimal string.
          example: '284300000'
        payableX:
          type: string
          description: nanoERG the vault can actually part with — balanceX less vaultMin. Decimal string.
          example: '9320000000'
        payableY:
          type: string
          description: Tokens the vault can part with. Nothing is held back on this side. Decimal string.
          example: '284300000'
        tokenY:
          type: string
          description: The pool's token, absent while the vault holds no token entry
          example: '86e272f770aa4ef48ad7e6d6dbe98b5069edd8383a403a8edb3ceed8a3d5cea3'
        vaultMin:
          type: string
          description: Held back from every payout so the vault survives storage rent. Decimal string.
          example: '100000000'
        lastFlushHeight:
          type: integer
          format: int32
          description: Height of the most recent flush observed. Absent until one is seen.
          example: 1298100
        syncHeight:
          type: integer
          format: int32
          example: 1312460

    LDSwapRequest:
      description: Amount and direction of a swap to quote
      type: object
      x-tags: lithosdex
      required:
        - amountIn
        - ergIn
      properties:
        amountIn:
          type: string
          description: >
            Total handed to the pool, fees included — this is what leaves the wallet. Decimal string.
          example: '1000000000'
        ergIn:
          type: boolean
          description: True to sell ERG for the token, false to sell the token for ERG
          example: true

    LDSwapExecuteRequest:
      description: A swap to sign and submit
      type: object
      x-tags: lithosdex
      required:
        - amountIn
        - ergIn
        - minOutput
      properties:
        amountIn:
          type: string
          description: Total handed to the pool, fees included. Decimal string.
          example: '1000000000'
        ergIn:
          type: boolean
          example: true
        minOutput:
          type: string
          description: >
            Floor below which the swap must be rejected. Required, and must not be negative — a
            negative floor is no floor. Decimal string.
          example: '29974258'
        expectedPoolBoxId:
          type: string
          description: >
            Pool box the quote was made against. Returns 409 instead of re-quoting if it moved.
          example: 'a1f4c2e8b7d93052416fbc8e07d21935a8c4f60b2e91d7385c06a4b1f2e83d97'

    LDSwapOutputRequest:
      description: Desired output and direction, for a reverse quote
      type: object
      x-tags: lithosdex
      required:
        - amountOut
        - ergIn
      properties:
        amountOut:
          type: string
          description: Amount that should come back out. Decimal string.
          example: '30000000'
        ergIn:
          type: boolean
          example: true

    LDSwapQuote:
      description: Quote for a LithosDex swap
      type: object
      x-tags: lithosdex
      required:
        - ergIn
        - amountIn
        - protocolFee
        - ammFee
        - tradedIn
        - amountOut
        - totalFee
        - spotBefore
        - spotAfter
        - executionPrice
        - priceImpact
        - isExecutable
      properties:
        ergIn:
          type: boolean
          example: true
        amountIn:
          type: string
          description: Total handed to the pool, fees included. Decimal string.
          example: '1000000000'
        protocolFee:
          type: string
          description: Taken out of the input and set aside for liquidity providers. Decimal string.
          example: '1500000'
        ammFee:
          type: string
          description: The curve's own fee on the remainder; stays in the pool. Decimal string.
          example: '1497750'
        tradedIn:
          type: string
          description: What actually reaches the curve — amountIn less protocolFee. Decimal string.
          example: '998500000'
        amountOut:
          type: string
          description: What comes back. Decimal string.
          example: '30124883'
        totalFee:
          type: string
          description: Every fee the swap pays, on the input side. Decimal string.
          example: '2997750'
        spotBefore:
          type: number
          format: double
          description: Pre-trade price, ignoring fees and depth
          example: 0.0302
        spotAfter:
          type: number
          format: double
          description: Price once the swap lands, ignoring fees
          example: 0.0301
        executionPrice:
          type: number
          format: double
          description: Output per unit of input, fees and depth included
          example: 0.0301
        priceImpact:
          type: number
          format: double
          description: How far execution fell short of the pre-trade price, as a fraction
          example: 0.0031
        isExecutable:
          type: boolean
          description: >
            False when the pool would reject the swap — nothing reaches the curve, or the output
            would meet or exceed the reserve it is drawn from.
          example: true

    LDSwapResult:
      description: Result of a LithosDex swap transaction
      type: object
      x-tags: lithosdex
      required:
        - amountOut
        - txId
      properties:
        amountOut:
          type: string
          description: Amount received. Decimal string.
          example: '30124883'
        txId:
          type: string
          example: '40b7d045a858d537cdbf072e46ffbb86c0c9f6b0e93c369c1ffcba76797636d7'

    LDDepositRequest:
      description: >
        A deposit to quote. Supply `availableX` and `availableY` for the most shares those funds
        can buy, or `shares` for the cheapest deposit that buys exactly that many.
      type: object
      x-tags: lithosdex
      properties:
        availableX:
          type: string
          description: nanoERG available to deposit. Decimal string.
          example: '5000000000'
        availableY:
          type: string
          description: Raw token units available to deposit. Decimal string.
          example: '151000000'
        shares:
          type: string
          description: Exact number of LP shares to buy. Decimal string.
          example: '1176470'

    LDDepositExecuteRequest:
      description: A deposit to sign and submit
      type: object
      x-tags: lithosdex
      required:
        - shares
      properties:
        shares:
          type: string
          description: LP shares to unlock, as returned by the quote. Decimal string.
          example: '1176470'
        maxAmountX:
          type: string
          description: Most you will pay on the ERG side. Decimal string.
          example: '5000000000'
        maxAmountY:
          type: string
          description: Most you will pay on the token side. Decimal string.
          example: '151058823'
        expectedPoolBoxId:
          type: string
          description: The pool box this was quoted against
          example: 'a1f4c2e8b7d93052416fbc8e07d21935a8c4f60b2e91d7385c06a4b1f2e83d97'

    LDDepositQuote:
      description: Quote for a LithosDex liquidity deposit
      type: object
      x-tags: lithosdex
      required:
        - shares
        - amountX
        - amountY
        - shareOfSupply
        - provisionBoxValue
        - totalErgRequired
        - entryX
        - entryY
      properties:
        shares:
          type: string
          description: LP shares the deposit unlocks; becomes the provision's size. Decimal string.
          example: '1176470'
        amountX:
          type: string
          description: nanoERG the pool takes. Decimal string.
          example: '5000000000'
        amountY:
          type: string
          description: Raw token units the pool takes. Decimal string.
          example: '151058823'
        shareOfSupply:
          type: number
          format: double
          description: Fraction of the pool the provision will represent once it lands
          example: 0.00117
        provisionBoxValue:
          type: string
          description: nanoERG that must also fund the new provision box, on top of amountX. Decimal string.
          example: '600000000'
        totalErgRequired:
          type: string
          description: Total nanoERG leaving the wallet, network fee aside. Decimal string.
          example: '5600000000'
        entryX:
          type: string
          description: >
            Accumulator the provision enters at. It is owed nothing accrued before this. Decimal string.
          example: '41820000000000000000000000'
        entryY:
          type: string
          description: Token side of the same. Decimal string.
          example: '1264000000000000000000000'

    LDDepositResult:
      description: Result of a LithosDex liquidity deposit transaction
      type: object
      x-tags: lithosdex
      required:
        - provisionBoxId
        - ownerNFT
        - shares
        - amountX
        - amountY
        - txId
      properties:
        provisionBoxId:
          type: string
          description: UTXO id of the newly minted provision box
          example: 'ce00d6e0f4fd3390c0519bb0d24824e1e6b06978163f4845a7cf2c1c7d8f1b65'
        ownerNFT:
          type: string
          description: >
            Token that owns the provision. Whoever holds it controls the provision, and it does
            not change when the box id does.
          example: 'a1f4c2e8b7d93052416fbc8e07d21935a8c4f60b2e91d7385c06a4b1f2e83d97'
        shares:
          type: string
          example: '1176470'
        amountX:
          type: string
          example: '5000000000'
        amountY:
          type: string
          example: '151058823'
        txId:
          type: string
          example: '40b7d045a858d537cdbf072e46ffbb86c0c9f6b0e93c369c1ffcba76797636d7'

    LDRedeemRequest:
      description: The provision to close, and the bounds it must respect
      type: object
      x-tags: lithosdex
      required:
        - provisionBoxId
      properties:
        provisionBoxId:
          type: string
          example: 'ce00d6e0f4fd3390c0519bb0d24824e1e6b06978163f4845a7cf2c1c7d8f1b65'
        minAmountX:
          type: string
          description: Least you will accept back on the ERG side. Decimal string.
          example: '53125000000'
        minAmountY:
          type: string
          description: The same on the token side. Decimal string.
          example: '1605000000'
        expectedPoolBoxId:
          type: string
          description: The pool box this was quoted against
          example: 'a1f4c2e8b7d93052416fbc8e07d21935a8c4f60b2e91d7385c06a4b1f2e83d97'
        acknowledgeUnclaimedFees:
          type: boolean
          description: >
            Must be true to redeem a provision that still has unclaimed fees, which are lost when
            it is spent. Ignored when there are none.
          example: false

    LDRedeemQuote:
      description: Quote for closing a LithosDex provision
      type: object
      x-tags: lithosdex
      required:
        - shares
        - amountX
        - amountY
        - withinMinSupply
        - unclaimedX
        - unclaimedY
      properties:
        shares:
          type: string
          description: LP shares that would be closed. Decimal string.
          example: '12500000000'
        amountX:
          type: string
          description: nanoERG returned. Liquidity only — fees settle separately. Decimal string.
          example: '53125000000'
        amountY:
          type: string
          description: Raw token units returned. Decimal string.
          example: '1605000000'
        withinMinSupply:
          type: boolean
          description: >
            False when closing this provision would take supply under the contract's minimum,
            which the pool refuses.
          example: true
        unclaimedX:
          type: string
          description: >
            Unclaimed ERG fees. **Lost** if the provision is redeemed without claiming them first.
            Decimal string.
          example: '402000000'
        unclaimedY:
          type: string
          description: Token side of the same. Decimal string.
          example: '12100000'

    LDRedeemResult:
      description: Result of a LithosDex redemption transaction
      type: object
      x-tags: lithosdex
      required:
        - shares
        - amountX
        - amountY
        - txId
      properties:
        shares:
          type: string
          example: '12500000000'
        amountX:
          type: string
          example: '53125000000'
        amountY:
          type: string
          example: '1605000000'
        txId:
          type: string
          example: '40b7d045a858d537cdbf072e46ffbb86c0c9f6b0e93c369c1ffcba76797636d7'

    LDProvision:
      description: >
        A liquidity provision box, with both what it has earned and what it can currently be paid.
      type: object
      x-tags: lithosdex
      required:
        - boxId
        - ownerNFT
        - shares
        - entryX
        - entryY
        - value
        - createdHeight
        - shareOfSupply
        - accruedX
        - accruedY
        - claimableX
        - claimableY
        - unflushedX
        - unflushedY
        - canClaim
        - awaitingFlush
      properties:
        boxId:
          type: string
          description: Provision box id. Changes on every claim and resize.
          example: 'ce00d6e0f4fd3390c0519bb0d24824e1e6b06978163f4845a7cf2c1c7d8f1b65'
        ownerNFT:
          type: string
          description: Token that owns this provision. Unchanged by claims and resizes.
          example: 'a1f4c2e8b7d93052416fbc8e07d21935a8c4f60b2e91d7385c06a4b1f2e83d97'
        shares:
          type: string
          description: LP shares this provision represents. Decimal string.
          example: '12500000000'
        entryX:
          type: string
          description: Accumulator this provision last settled at. Decimal string.
          example: '18400000000000000000000000'
        entryY:
          type: string
          description: Token side of the same. Decimal string.
          example: '552000000000000000000000'
        value:
          type: string
          description: nanoERG held by the provision box. Decimal string.
          example: '600000000'
        createdHeight:
          type: integer
          format: int32
          example: 1284400
        shareOfSupply:
          type: number
          format: double
          example: 0.0125
        accruedX:
          type: string
          description: >
            ERG earned according to the pool, including fees not yet flushed. This is the figure to
            show a provider as "earned". Decimal string.
          example: '292750000'
        accruedY:
          type: string
          description: Token side of the same. Decimal string.
          example: '8900000'
        claimableX:
          type: string
          description: ERG that can be paid out now. Never negative. Decimal string.
          example: '253000000'
        claimableY:
          type: string
          description: Token side of the same. Decimal string.
          example: '7690000'
        unflushedX:
          type: string
          description: accruedX less claimableX — what a flush would release. Decimal string.
          example: '39750000'
        unflushedY:
          type: string
          description: Token side of the same. Decimal string.
          example: '1210000'
        canClaim:
          type: boolean
          description: Whether a claim would be accepted right now.
          example: true
        awaitingFlush:
          type: boolean
          description: >
            True when nothing can be claimed until the next flush. Normal after a deposit or
            resize; not an error.
          example: false

    LDProvisionList:
      description: Liquidity provisions held by this wallet
      type: object
      x-tags: lithosdex
      required:
        - provisions
      properties:
        provisions:
          type: array
          items:
            $ref: '#/components/schemas/LDProvision'

    LDClaimRequest:
      description: >
        Optional bounds for a claim. Every field, and the body itself, may be omitted.
      type: object
      x-tags: lithosdex
      properties:
        expectedVaultBoxId:
          type: string
          description: The vault box this was quoted against
          example: '88c297f99da7172f6aa20efbead69aa40e2b7734a1873d66ca1db6b19d214db6'
        expectedProvisionBoxId:
          type: string
          description: The provision box this was quoted against
          example: 'ce00d6e0f4fd3390c0519bb0d24824e1e6b06978163f4845a7cf2c1c7d8f1b65'
        minAmountX:
          type: string
          description: Least you will accept on the ERG side. Decimal string.
          example: '253000000'
        minAmountY:
          type: string
          description: The same on the token side. Decimal string.
          example: '7690000'

    LDClaimResult:
      description: Result of a LithosDex fee claim transaction
      type: object
      x-tags: lithosdex
      required:
        - claimedX
        - claimedY
        - successorBoxId
        - txId
      properties:
        claimedX:
          type: string
          description: nanoERG paid out of the vault. Decimal string.
          example: '253000000'
        claimedY:
          type: string
          description: Raw token units paid out of the vault. Decimal string.
          example: '7690000'
        successorBoxId:
          type: string
          description: New provision box id. Use it for the next request.
          example: '5035b2e112b4f5b873dd3444c01df1e7e697807fd84fe96790eacb128e46428d'
        txId:
          type: string
          example: '40b7d045a858d537cdbf072e46ffbb86c0c9f6b0e93c369c1ffcba76797636d7'

    LDResizeRequest:
      description: New size for a provision, and the bounds it must respect
      type: object
      x-tags: lithosdex
      required:
        - newShares
      properties:
        newShares:
          type: string
          description: >
            Size the provision should become. Must be positive — a resize to zero is a redemption.
            Decimal string.
          example: '20000000000'
        maxAmountX:
          type: string
          description: Most you will contribute on the ERG side, when increasing. Decimal string.
          example: '31875000000'
        maxAmountY:
          type: string
          description: Most you will contribute on the token side, when increasing. Decimal string.
          example: '963000000'
        minAmountX:
          type: string
          description: Least you will take back on the ERG side, when decreasing. Decimal string.
          example: '21250000000'
        minAmountY:
          type: string
          description: Least you will take back on the token side, when decreasing. Decimal string.
          example: '642000000'
        expectedPoolBoxId:
          type: string
          description: The pool box this was quoted against
          example: 'a1f4c2e8b7d93052416fbc8e07d21935a8c4f60b2e91d7385c06a4b1f2e83d97'
        expectedVaultBoxId:
          type: string
          description: Vault box the quote was made against. A resize also flushes.
          example: '88c297f99da7172f6aa20efbead69aa40e2b7734a1873d66ca1db6b19d214db6'
        expectedProvisionBoxId:
          type: string
          description: The provision box this was quoted against
          example: 'ce00d6e0f4fd3390c0519bb0d24824e1e6b06978163f4845a7cf2c1c7d8f1b65'

    LDResizeQuote:
      description: Quote for resizing a LithosDex provision
      type: object
      x-tags: lithosdex
      required:
        - oldShares
        - newShares
        - delta
        - increasing
        - amountX
        - amountY
        - nextEntryX
        - nextEntryY
        - withinMinSupply
      properties:
        oldShares:
          type: string
          example: '12500000000'
        newShares:
          type: string
          example: '20000000000'
        delta:
          type: string
          description: Change in shares; positive adds liquidity, negative removes it. Decimal string.
          example: '7500000000'
        increasing:
          type: boolean
          description: True when adding liquidity. Decides which bounds apply on execute.
          example: true
        amountX:
          type: string
          description: nanoERG the pool takes when increasing, or returns when decreasing. Decimal string.
          example: '31875000000'
        amountY:
          type: string
          description: Token side of the same. Decimal string.
          example: '963000000'
        nextEntryX:
          type: string
          description: >
            Entry the resized provision must carry, chosen so nothing already earned is lost. Decimal string.
          example: '29632000000000000000000000'
        nextEntryY:
          type: string
          example: '892400000000000000000000'
        withinMinSupply:
          type: boolean
          example: true

    LDResizeResult:
      description: Result of a LithosDex provision resize transaction
      type: object
      x-tags: lithosdex
      required:
        - boxId
        - newShares
        - amountX
        - amountY
        - txId
      properties:
        boxId:
          type: string
          description: New provision box id. Use it for the next request.
          example: 'ce00d6e0f4fd3390c0519bb0d24824e1e6b06978163f4845a7cf2c1c7d8f1b65'
        newShares:
          type: string
          example: '20000000000'
        amountX:
          type: string
          example: '31875000000'
        amountY:
          type: string
          example: '963000000'
        txId:
          type: string
          example: '40b7d045a858d537cdbf072e46ffbb86c0c9f6b0e93c369c1ffcba76797636d7'

    LDFlushCheck:
      description: State of a prospective flush from the pool into the vault
      type: object
      x-tags: lithosdex
      required:
        - pendingX
        - pendingY
        - canFlush
        - poolAccX
        - poolAccY
        - vaultAccX
        - vaultAccY
        - vaultBalanceAfterX
        - vaultBalanceAfterY
        - currentHeight
      properties:
        pendingX:
          type: string
          description: nanoERG fees the pool is holding for the vault. Decimal string.
          example: '3180000000'
        pendingY:
          type: string
          description: Token side of the same. Decimal string.
          example: '96400000'
        canFlush:
          type: boolean
          description: A flush needs something to move, or the pool rejects it
          example: true
        poolAccX:
          type: string
          description: The pool's current ERG accumulator. Decimal string.
          example: '41820000000000000000000000'
        poolAccY:
          type: string
          example: '1264000000000000000000000'
        vaultAccX:
          type: string
          description: >
            The vault's ERG accumulator. Trails the pool's; the gap is exactly the money the vault
            does not yet have. Decimal string.
          example: '38640000000000000000000000'
        vaultAccY:
          type: string
          example: '1167600000000000000000000'
        vaultBalanceAfterX:
          type: string
          description: What the vault would hold once the flush lands. Decimal string.
          example: '12600000000'
        vaultBalanceAfterY:
          type: string
          example: '380700000'
        lastFlushHeight:
          type: integer
          format: int32
          example: 1298100
        currentHeight:
          type: integer
          format: int32
          example: 1312460

    LDFlushRequest:
      description: >
        Optional bounds for a flush. Both fields, and the body itself, may be omitted.
      type: object
      x-tags: lithosdex
      properties:
        expectedPoolBoxId:
          type: string
          example: 'a1f4c2e8b7d93052416fbc8e07d21935a8c4f60b2e91d7385c06a4b1f2e83d97'
        expectedVaultBoxId:
          type: string
          example: '88c297f99da7172f6aa20efbead69aa40e2b7734a1873d66ca1db6b19d214db6'

    LDFlushResult:
      description: Result of a LithosDex flush transaction
      type: object
      x-tags: lithosdex
      required:
        - flushedX
        - flushedY
        - txId
      properties:
        flushedX:
          type: string
          description: nanoERG moved into the vault. Decimal string.
          example: '3180000000'
        flushedY:
          type: string
          description: Raw token units moved into the vault. Decimal string.
          example: '96400000'
        txId:
          type: string
          example: '40b7d045a858d537cdbf072e46ffbb86c0c9f6b0e93c369c1ffcba76797636d7'

    LDFeeHistoryPoint:
      description: One bucket of fee history
      type: object
      x-tags: lithosdex
      required:
        - height
        - periodX
        - periodY
        - cumulativeX
        - cumulativeY
      properties:
        height:
          type: integer
          format: int32
          description: Block height at the end of this bucket
          example: 1312460
        timestamp:
          type: integer
          format: int64
          description: Unix milliseconds at the end of this bucket. Absent if unresolved.
          example: 1765432100000
        periodX:
          type: string
          description: nanoERG fees taken during this bucket. Decimal string.
          example: '210000000'
        periodY:
          type: string
          example: '6350000'
        cumulativeX:
          type: string
          description: nanoERG fees taken from the start of the range to here. Decimal string.
          example: '8420000000'
        cumulativeY:
          type: string
          example: '254300000'

    LDFeeHistory:
      description: Bucketed fee history for the pool
      type: object
      x-tags: lithosdex
      required:
        - history
        - partial
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/LDFeeHistoryPoint'
        partial:
          type: boolean
          description: >
            True when the series does not reach back to the pool's start. The points returned are
            still exact.
          example: false

    LDProvisionFeeHistory:
      description: Bucketed fee history for a single provision
      type: object
      x-tags: lithosdex
      required:
        - boxId
        - history
        - partial
      properties:
        boxId:
          type: string
          example: 'ce00d6e0f4fd3390c0519bb0d24824e1e6b06978163f4845a7cf2c1c7d8f1b65'
        history:
          type: array
          items:
            $ref: '#/components/schemas/LDFeeHistoryPoint'
        partial:
          type: boolean
          description: True when the series does not reach back to the pool's start.
          example: false

    WalletToken:
      description: A token balance held by the wallet
      type: object
      x-tags: lithosdex
      required:
        - tokenId
        - amount
      properties:
        tokenId:
          type: string
          example: '86e272f770aa4ef48ad7e6d6dbe98b5069edd8383a403a8edb3ceed8a3d5cea3'
        name:
          type: string
          example: 'LIT'
        decimals:
          type: integer
          format: int32
          example: 4
        amount:
          type: string
          description: Raw token units held. Decimal string.
          example: '5420000000'

    WalletBalance:
      description: ERG and token balances for the client's wallet
      type: object
      x-tags: lithosdex
      required:
        - nanoErgs
        - tokens
      properties:
        nanoErgs:
          type: string
          description: nanoERG held by the wallet. Decimal string.
          example: '182400000000'
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/WalletToken'

    NISPRepresentation:
      description: Representation of a 10 super share NISP
      x-tags: mining
      type: object
      required:
        - score
        - height
        - headers
        - bytes
      properties:
        score:
          type: integer
          format: int64
          description: Score associated with this NISP, to be used in payout calculations
          example: 5000000
        height:
          type: integer
          format: int32
          description: Height all super-shares in this NISP must be under
          example: 45096
        headers:
          type: array
          maxItems: 10
          minItems: 10
          description: Header bytes associated with each super-share in this NISP
          items:
            type: string
            example: ''
          example: ['']
        bytes:
          type: string
          description: Serialized (hex-encoded) bytes of this NISP
          example: '00f6318aa84791d0...a0bdc8045a70f931'
  securitySchemes:
    ApiKeyAuth:
      description: >
        Api key authorization used by Lithos. The hash of this key must be placed in your config, under `lithos.apiKeyHash`.
        The default value is `hello`.
      type: apiKey
      name: api_key
      in: header
